      <path style="fill:var(--icon-fill,#F26A1B)" d="M16 14 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 Z"/>
      <path style="fill:var(--icon-fill,#F26A1B)" d="M9 42 v-5 a13 13 0 0 1 26 0 v5 Z"/>
      <path style="fill:none" d="M18 32 h8 v10"/>
      <path style="fill:var(--icon-fill,#F26A1B)" d="M30 35 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 Z"/>
      <path style="fill:none" d="M37 31 v8"/>
    </g>
  </symbol>

  <!-- Ventas · día y semana · calendario con barras -->
  <symbol id="icon-ventas-semana" viewBox="0 0 48 48">
    <g style="stroke:var(--icon-stroke,#FFF1E2);stroke-width:var(--icon-sw,3);stroke-linecap:round;stroke-linejoin:round">
      <path style="fill:var(--icon-fill,#F26A1B)" d="M11 10 h26 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-26 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4 Z"/>
      <path style="fill:none" d="M7 18 h34 M16 6 v7 M32 6 v7"/>
      <path style="fill:none" d="M15 35 v-6 M21 35 v-10 M27 35 v-4 M33 35 v-12"/>
    </g>
  </symbol>

  <!-- ===== Íconos de apoyo (v2.4.2) · mismo grid y trazo ===== -->

  <!-- Venta perdida · gráfica a la baja -->
  <symbol id="icon-venta-perdida" viewBox="0 0 48 48">
    <g style="stroke:var(--icon-stroke,#FFF1E2);stroke-width:var(--icon-sw,3);stroke-linecap:round;stroke-linejoin:round">
      <path style="fill:var(--icon-fill,#F26A1B)" d="M8 8 h32 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 v-24 a4 4 0 0 1 4 -4 Z"/>
      <path style="fill:none" d="M11 16 l9 9 l6 -5 l11 11"/>
      <path style="fill:none" d="M37 23 v8 h-8"/>
    </g>
  </symbol>

  <!-- Transferencia · banco -->
  <symbol id="icon-transferencia" viewBox="0 0 48 48">
    <g style="stroke:var(--icon-stroke,#FFF1E2);stroke-width:var(--icon-sw,3);stroke-linecap:round;stroke-linejoin:round">
      <path style="fill:var(--icon-fill,#F26A1B)" d="M24 5 L43 15 H5 Z"/>
      <path style="fill:none" d="M11 20 v13 M19.5 20 v13 M28.5 20 v13 M37 20 v13"/>
      <path style="fill:var(--icon-fill,#F26A1B)" d="M5 37 h38 v5 h-38 Z"/>
    </g>
  </symbol>

  <!-- Efectivo · billete -->
