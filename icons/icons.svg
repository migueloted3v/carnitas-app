<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Sprite de íconos · Carnitas Estilo Clay
    Grid 48x48 · trazo 3 px · puntas y uniones redondeadas
    Colores controlados por variables CSS (ver icons.css):
      icon-fill    relleno de la forma principal
      icon-stroke  trazo y detalles sólidos
      icon-sw      grosor del trazo
      badge-fill / badge-stroke  colores del escudo
  -->

  <!-- Escudo de la presentación Insignia (viewBox 80x88) -->
  <symbol id="icon-badge" viewBox="0 0 80 88">
    <path d="M8 12 Q40 2 72 12 L72 46 Q72 70 40 84 Q8 70 8 46 Z"
      style="fill:var(--badge-fill,#F26A1B);stroke:var(--badge-stroke,#FFFFFF);stroke-width:3.5;stroke-linejoin:round"/>
  </symbol>

  <!-- Ventas · cazo de cobre -->
  <symbol id="icon-ventas" viewBox="0 0 48 48">
    <g style="stroke:var(--icon-stroke,#FFF1E2);stroke-width:var(--icon-sw,3);stroke-linecap:round;stroke-linejoin:round">
      <path style="fill:none" d="M6.5 22 h-3 a3 3 0 0 0 0 6 h4 M41.5 22 h3 a3 3 0 0 1 0 6 h-4"/>
      <path style="fill:var(--icon-fill,#F26A1B)" d="M5 18 h38 l-3 14 a10 10 0 0 1 -10 8 h-12 a10 10 0 0 1 -10 -8 Z"/>
      <path style="fill:none" d="M3 18 h42"/>
      <path style="fill:none" d="M17 12 q-2 -3 0 -6 M24 12 q-2 -3 0 -6 M31 12 q-2 -3 0 -6"/>
      <path style="fill:none" d="M13 25 h5"/>
    </g>
  </symbol>

  <!-- Cotizaciones · portapapeles con palomita -->
  <symbol id="icon-cotizaciones" viewBox="0 0 48 48">
    <g style="stroke:var(--icon-stroke,#FFF1E2);stroke-width:var(--icon-sw,3);stroke-linecap:round;stroke-linejoin:round">
      <path style="fill:var(--icon-fill,#F26A1B)" d="M14 9 h20 a3 3 0 0 1 3 3 v28 a3 3 0 0 1 -3 3 h-20 a3 3 0 0 1 -3 -3 v-28 a3 3 0 0 1 3 -3 Z"/>
      <path style="fill:var(--icon-stroke,#FFF1E2)" d="M19 5 h10 a2 2 0 0 1 2 2 v4 h-14 v-4 a2 2 0 0 1 2 -2 Z"/>
      <path style="fill:none" d="M17 20 h14 M17 26 h14 M17 32 h7"/>
      <path style="fill:none" d="M27 35 l3 3 l5 -6"/>
    </g>
  </symbol>

  <!-- Insumos · carrito de supermercado -->
  <symbol id="icon-insumos" viewBox="0 0 48 48">
    <g style="stroke:var(--icon-stroke,#FFF1E2);stroke-width:var(--icon-sw,3);stroke-linecap:round;stroke-linejoin:round">
      <path style="fill:none" d="M3 8 h5 l1.5 6"/>
      <path style="fill:var(--icon-fill,#F26A1B)" d="M9.5 14 h33 l-3.6 14.5 a2.5 2.5 0 0 1 -2.4 1.9 h-22.6 a2.5 2.5 0 0 1 -2.4 -2 Z"/>
      <path style="fill:none" d="M20 14 v16 M31 14 v16"/>
      <path style="fill:none" d="M13 30.5 l0.8 4.5 h23"/>
      <path style="fill:var(--icon-fill,#F26A1B)" d="M14 40 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0 Z M30 40 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0 Z"/>
    </g>
  </symbol>

  <!-- Gastos · cartera con flecha de salida -->
  <symbol id="icon-gastos" viewBox="0 0 48 48">
    <g style="stroke:var(--icon-stroke,#FFF1E2);stroke-width:var(--icon-sw,3);stroke-linecap:round;stroke-linejoin:round">
      <path style="fill:var(--icon-fill,#F26A1B)" d="M10 15 h26 a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 h-26 a4 4 0 0 1 -4 -4 v-18 a4 4 0 0 1 4 -4 Z"/>
