<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnitas · Tablero</title>
<meta name="theme-color" content="#153243">
<link rel="icon" href="icon.png">
<style>
  :root{
    --bg:#F4F6F8; --card:#FFFFFF; --line:#E3E8EC; --ink:#153243; --ink2:#51687A; --muted:#7A8F9E;
    --mark:#153243; --mark2:#9FB6C4; --accent:#F85E00; --neg:#C94900; --track:#EEF1F4;
    --up:#2F7D32; --down:#C23B22; --warn:#9A6200; --chip:#153243; --chipTxt:#FFFFFF; --tipBg:#153243; --tipTx:#FFFFFF;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      --bg:#0E1C26; --card:#15293A; --line:#24394B; --ink:#E6EDF2; --ink2:#AFC2CF; --muted:#8499A8;
      --mark:#8FB0C6; --mark2:#4E6A80; --accent:#FF7A2E; --neg:#D9642A; --track:#1D3446;
      --up:#7FD49B; --down:#FF8A80; --warn:#F5C26B; --chip:#E6EDF2; --chipTxt:#0E1C26; --tipBg:#E6EDF2; --tipTx:#0E1C26;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1C26; --card:#15293A; --line:#24394B; --ink:#E6EDF2; --ink2:#AFC2CF; --muted:#8499A8;
    --mark:#8FB0C6; --mark2:#4E6A80; --accent:#FF7A2E; --neg:#D9642A; --track:#1D3446;
    --up:#7FD49B; --down:#FF8A80; --warn:#F5C26B; --chip:#E6EDF2; --chipTxt:#0E1C26; --tipBg:#E6EDF2; --tipTx:#0E1C26;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  button,select,input{font-family:inherit;font-size:13px;color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .brand h1{font-size:20px;font-weight:500;margin:0}
  .brand p{font-size:12px;color:var(--muted);margin:2px 0 0}
  .sp{flex:1}
  .tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tabs button{border:none;background:none;padding:7px 14px;border-radius:7px;color:var(--ink2);cursor:pointer}
  .tabs button.on{background:var(--chip);color:var(--chipTxt)}
  .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  select,input[type=date],input[type=month],input[type=text],input[type=password],input[type=url]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  .btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .navp{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px}
  .navp button{border:none;background:none;padding:7px 10px;cursor:pointer;color:var(--ink2);font-size:15px}
  .navp span{padding:0 6px;white-space:nowrap}
  .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
  .filtro{display:inline-flex;align-items:center;gap:8px;background:var(--chip);color:var(--chipTxt);border-radius:16px;padding:5px 12px;font-size:12px;margin:0 0 12px}
  .filtro button{background:none;border:none;color:var(--chipTxt);cursor:pointer;font-size:13px;padding:0}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi.hl{box-shadow:inset 0 3px 0 var(--accent)}
  .kpi .l{font-size:12px;color:var(--muted);margin:0}
  .kpi .v{font-size:26px;font-weight:500;margin:6px 0 4px;letter-spacing:-.3px}
  .kpi .d{font-size:12px;margin:0;color:var(--muted)}
  .kpi .d.up{color:var(--up)} .kpi .d.down{color:var(--down)}
  .g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
  .g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
  .card h3{font-size:13px;font-weight:500;margin:0 0 14px;display:flex;justify-content:space-between;gap:8px}
  .card h3 small{font-weight:400;color:var(--muted);font-size:12px}
  .row{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:8px;border-radius:6px}
  .row.clic{cursor:pointer;padding:2px 4px;margin:0 -4px 6px}
  .row.clic:hover{background:var(--track)}
  .row.sel .n{color:var(--accent);font-weight:500}
  .row .n{width:110px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .b{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
  .row .b i{display:block;height:100%;background:var(--mark);border-radius:4px}
  .row .v{width:100px;text-align:right;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-weight:400;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
  td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th.r,td.r{text-align:right}
  tr:last-child td{border-bottom:none}
  tr.clic{cursor:pointer} tr.clic:hover td{background:var(--track)}
  tr.corte td{border-bottom:2px dashed var(--accent)}
  .pl .tot td{font-weight:500;border-top:1.5px solid var(--ink)}
  .stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0 12px}
  .lg{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
  .lgs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--ink2);margin-top:6px}
  .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px;display:inline-block}
  .note{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.5}
  .aviso{background:var(--card);border:1px solid var(--down);border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:12px}
  .aviso b{color:var(--down);font-weight:500}
  .insights{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--ink2)}
  .insights b{color:var(--ink);font-weight:500}
  .fl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.55;color:var(--ink2)}
  .fl:first-of-type{border-top:none;padding-top:0}
  .fl b{color:var(--ink);font-weight:500}
  .fl code,.note code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .ic{flex:0 0 22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .ic.up{color:var(--up);background:color-mix(in srgb,var(--up) 16%,transparent)}
  .ic.dn{color:var(--down);background:color-mix(in srgb,var(--down) 16%,transparent)}
  .ic.wa{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
  .seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:12px}
  .seg button{border:none;background:none;padding:7px 12px;border-radius:7px;color:var(--ink2);cursor:pointer}
  .seg button.on{background:var(--chip);color:var(--chipTxt)}
  .seg button em{font-style:normal;margin-left:6px;color:var(--muted)}
  .seg button.on em{color:inherit}
  .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .mini div{background:var(--bg);border-radius:8px;padding:10px 12px}
  .mini p{margin:0;font-size:12px;color:var(--muted)}
  .mini b{display:block;font-size:17px;font-weight:500;margin-top:2px}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;margin-left:6px;color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent);white-space:nowrap}
  .tscroll{overflow-x:auto}
  .tscroll table{min-width:560px}
  .vacio{color:var(--muted);text-align:center;padding:24px 0;font-size:13px}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--ink2)}
  .empty h2{font-size:17px;font-weight:500;margin:0 0 6px;color:var(--ink)}
  .src{max-width:520px;margin:18px auto 0;text-align:left}
  .src label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .src input{width:100%}
  .drop{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:16px;cursor:pointer}
  .drop.on{border-color:var(--accent)}
  .big{font-size:22px;font-weight:500}
  #tip{position:fixed;pointer-events:none;background:var(--tipBg);color:var(--tipTx);font-size:12px;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:10;white-space:nowrap}
  svg text{font-family:inherit}
  .hid{display:none !important}
  .err{color:var(--down);font-size:12px;margin-top:8px}
  @media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .g2,.g2e,.g3{grid-template-columns:1fr} }
  @media print{ .ctl,.tabs,#tip{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><h1>Carnitas</h1><p id="srcTxt">Sin datos cargados</p></div>
    <div class="sp"></div>
    <div class="tabs hid" id="tabs"></div>
    <div class="ctl hid" id="ctl">
      <select id="periodo" aria-label="Periodo">
        <option value="semana" selected>Semana</option>
        <option value="4sem">Últimas 4 semanas</option>
        <option value="mes">Mes</option>
        <option value="todo">Todo el histórico</option>
        <option value="custom">Personalizado…</option>
      </select>
      <div class="navp" id="navp"><button id="prev" aria-label="Anterior">‹</button><span id="rangoTxt"></span><button id="next" aria-label="Siguiente">›</button></div>
      <input type="date" id="desde" class="hid" aria-label="Desde">
      <input type="date" id="hasta" class="hid" aria-label="Hasta">
      <button class="btn" id="refresh" title="Actualizar datos">↻</button>
      <button class="btn" id="fuente" title="Cambiar fuente de datos">⚙</button>
    </div>
    <button class="btn" id="tema" title="Cambiar tema"></button>
  </div>
  <p class="sub" id="subTxt"></p>
  <div id="filtroBox"></div>
  <div id="main"></div>
</div>
<div id="tip"></div>

<script>
const DASH_VERSION = '2.3.0';

/* ================= Formatos y fechas ================= */
const MXN = n => (n<0?'-':'') + '$' + Math.round(Math.abs(n||0)).toLocaleString('es-MX');
const K = n => Math.abs(n) >= 1000 ? (n<0?'-':'') + '$' + (Math.abs(n)/1000).toFixed(1) + 'k' : MXN(n);
const PCT = (n, d=0) => (isFinite(n) ? (n*100).toFixed(d) : '0') + '%';
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); return iso(new Date(y, m-1, d+n)); };
const dow = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d).getDay(); };
const diffDays = (a, b) => Math.round((new Date(b+'T12:00') - new Date(a+'T12:00'))/86400000);
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const corto = s => { const [y,m,d] = s.split('-').map(Number); return `${d} ${MES[m-1]}`; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq = s => String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");

// Semana del negocio: viernes a jueves. Las ventas de sábado y domingo se cruzan
// con los insumos, gastos y sueldos de esos 7 días.
const semanaDe = s => addDays(s, -((dow(s) - 5 + 7) % 7));

/* ================= Modelo ================= */
const ENC = {
  Ventas:['Fecha','Ticket','Categoría','Producto','Modo','Cantidad','Precio unitario','Total','Método de pago'],
  Insumos:['Fecha','Categoría','Producto','Cantidad','Tipo','Precio unitario','Costo total','Proveedor'],
  Gastos:['Fecha','Categoría','Descripción','Monto','Proveedor'],
  Sueldos:['Fecha','Nombre','Puesto','Días trabajados','Monto pagado'],
  VentasPerdidas:['Fecha','Categoría','Kilos estimados','Motivo','Monto estimado','Piezas estimadas']
};
const ALIAS = {'Corte deseado':'Categoría'};
// Cortes que se cocinan como carnitas: base del rendimiento (sin manteca, pellet, cuero ni cachete)
const CORTES_COCCION = ['Pierna','Nuca','Aldilla','Costilla','Buche','Maciza','Chamorro','Codillo'];
const CORTES_CARNE = ['Surtido','Maciza','Pierna','Chamorro','Buche','Aldilla','Nuca','Costilla','Cuerito','No especificó'];

let RAW = null, FUENTE = '', TAB = 'resumen', FILTRO = null, TABLA = 'Ventas';
let SERVICIO = null; // {version, tz} del servicio en vivo; null si los datos vienen de un Excel
let CURSOR = null;   // viernes de la semana elegida (semana y 4 semanas) o 'aaaa-mm' (mes)

// Producto para análisis: los renglones de Surtido repartidos por corte (versión 2.2) cuentan como Surtido
function prodKey(r){ return r[4]==='Surtido' ? 'Surtido' : (r[3] || '-'); }

function kgCarne(r){
  if(r[2] !== 'Carne') return 0;
  const m = r[4], c = num(r[5]), p = num(r[6]), t = num(r[7]);
  if(m==='Fracción' || m==='Surtido') return c;
  if(m==='Gramos') return c/1000;
  if(m==='Monto' || m==='Dinero') return p>0 ? t/p : 0;
  return 0;
}

function normalizar(datos){
  const out = {};
  Object.keys(ENC).forEach(k => {
    out[k] = (datos[k] || []).map(r => {
      const f = r.slice(0, ENC[k].length); while(f.length < ENC[k].length) f.push('');
      f[0] = String(f[0]||'');
      return f;
    }).filter(r => /^\d{4}-\d{2}-\d{2}/.test(r[0]));
  });
  out.VentasPerdidas.forEach(r => { if(CORTES_CARNE.includes(r[1])) r[1] = 'Carne'; });
  return out;
}

/* ================= Fuentes ================= */
function cfgServicio(){
  try{
    const d = JSON.parse(localStorage.getItem('carnitas_dash_cfg')||'null');
    if(d && d.scriptUrl && d.key) return d;
    const a = JSON.parse(localStorage.getItem('carnitas_cfg')||'null');
    if(a && a.scriptUrl && a.key) return a;
  }catch(e){}
  return null;
}

async function cargarServicio(cfg){
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 30000);
  try{
    const u = cfg.scriptUrl + (cfg.scriptUrl.includes('?')?'&':'?') + new URLSearchParams({action:'todo', key: cfg.key});
    const res = await fetch(u, {signal: ctrl.signal});
    let data; try{ data = await res.json(); }catch(e){ throw new Error('la URL no responde como el servicio (revisa que termine en /exec)'); }
    if(!data.ok) throw new Error(data.error || 'error del servicio');
    return {datos: data.datos, version: data.version || '', tz: data.tz || ''};
  }catch(e){
    if(e.name === 'AbortError') throw new Error('el servicio tardó demasiado');
    if(e instanceof TypeError) throw new Error('sin conexión con el servicio');
    throw e;
  }finally{ clearTimeout(t); }
}

function cargarLibreriaExcel(){
  return new Promise((res, rej) => {
    if(window.XLSX) return res();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error('no se pudo cargar el lector de Excel (¿sin internet?)'));
    document.head.appendChild(s);
  });
}

function serialAFecha(v){
  if(typeof v === 'number'){
    const d = new Date(Math.round((v - 25569) * 86400000));
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  }
  return String(v||'');
}

async function leerExcel(file){
  await cargarLibreriaExcel();
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  const datos = {};
  Object.keys(ENC).forEach(k => {
    const ws = wb.Sheets[k]; if(!ws) { datos[k] = []; return; }
    const filas = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    if(!filas.length) { datos[k] = []; return; }
    const enc = filas[0].map(h => ALIAS[String(h).trim()] || String(h).trim());
    const idx = ENC[k].map(h => enc.indexOf(h));
    datos[k] = filas.slice(1).map(r => idx.map((i, j) => i<0 ? '' : (j===0 ? serialAFecha(r[i]) : r[i])));
  });
  if(!datos.Ventas.length) throw new Error('el archivo no tiene la pestaña "Ventas"');
  return datos;
}

/* ================= Periodos (siempre semanas completas vie–jue) ================= */
function ultimaSemana(){ const f = RAW.Ventas.map(r=>r[0].slice(0,10)).sort(); return semanaDe(f[f.length-1]); }
function primeraSemana(){ const f = RAW.Ventas.map(r=>r[0].slice(0,10)).sort(); return semanaDe(f[0]); }

function rango(){
  const p = document.getElementById('periodo').value;
  let a, b;
  if(p==='semana'){ a = CURSOR; b = addDays(a, 6); }
  else if(p==='4sem'){ a = addDays(CURSOR, -21); b = addDays(CURSOR, 6); }
  else if(p==='mes'){
    // Semanas cuyo sábado cae en el mes elegido
    const [y,m] = CURSOR.split('-').map(Number);
    const primerSab = (()=>{ let d = `${CURSOR}-01`; while(dow(d)!==6) d = addDays(d,1); return d; })();
    a = addDays(primerSab, -1);
    let ult = primerSab; while(addDays(ult,7).slice(0,7)===CURSOR) ult = addDays(ult,7);
    b = addDays(ult, 5);
  }
  else if(p==='todo'){ a = primeraSemana(); b = addDays(ultimaSemana(), 6); }
  else {
    let d = document.getElementById('desde').value || ultimaSemana();
    let h = document.getElementById('hasta').value || addDays(ultimaSemana(), 6);
    if(d > h) [d, h] = [h, d];
    a = semanaDe(d); b = addDays(semanaDe(h), 6);
  }
  const largo = diffDays(a, b) + 1;
  return {a, b, pa: addDays(a, -largo), pb: addDays(a, -1), semanas: Math.round(largo/7)};
}

function semanasEntre(a, b){ const out = []; for(let s = semanaDe(a); s <= b; s = addDays(s, 7)) out.push(s); return out; }
const enRango = (rows, a, b) => rows.filter(r => { const d = r[0].slice(0,10); return d >= a && d <= b; });

function etiquetaRango(R){
  const p = document.getElementById('periodo').value;
  if(p==='mes'){ const [y,m] = CURSOR.split('-').map(Number); return `${MES_L[m-1]} ${y}`; }
  return `vie ${corto(R.a)} – jue ${corto(R.b)}`;
}

/* ================= Métricas ================= */
function pasaFiltro(r){
  if(!FILTRO) return true;
  return FILTRO.campo==='cat' ? r[2]===FILTRO.valor : prodKey(r)===FILTRO.valor;
}

function metricas(a, b){
  const V0 = enRango(RAW.Ventas, a, b);
  const V = V0.filter(r => r[2] !== 'Regalo' && pasaFiltro(r));
  const regalos = V0.filter(r => r[2] === 'Regalo');
  const I = enRango(RAW.Insumos, a, b), G = enRango(RAW.Gastos, a, b), S = enRango(RAW.Sueldos, a, b), P = enRango(RAW.VentasPerdidas, a, b);
  const total = V.reduce((s,r)=>s+num(r[7]),0);
  const tickets = new Set(V.map(r=>r[1]).filter(Boolean)).size;
  const dias = [...new Set(V.map(r=>r[0].slice(0,10)))].sort();
  const carne = I.filter(r=>r[1]==='Carne').reduce((s,r)=>s+num(r[6]),0);
  const otros = I.filter(r=>r[1]!=='Carne').reduce((s,r)=>s+num(r[6]),0);
  const sueldos = S.reduce((s,r)=>s+num(r[4]),0);
  const gastos = G.reduce((s,r)=>s+num(r[3]),0);
  const costos = carne + otros + gastos + sueldos;
  const utilidad = total - costos;
  const kgVend = V.reduce((s,r)=>s+kgCarne(r),0);
  const kgComp = I.filter(r=>r[1]==='Carne' && CORTES_COCCION.includes(r[2])).reduce((s,r)=>s+num(r[3]),0);
  // Semanas con ventas pero sin insumos capturados
  const semVenta = new Set(V0.filter(r=>r[2]!=='Regalo').map(r=>semanaDe(r[0].slice(0,10))));
  const semIns = new Set(I.map(r=>semanaDe(r[0].slice(0,10))));
  const sinCostos = [...semVenta].filter(s=>!semIns.has(s)).sort();
  return {V, regalos, I, G, S, P, total, tickets, dias, carne, otros, gastos, sueldos, costos, utilidad, kgVend, kgComp, sinCostos};
}

function porSemana(a, b){
  if(RAW.Ventas.length && a < primeraSemana()) a = primeraSemana();
  return semanasEntre(a, b).map(s => {
    const m = metricas(s, addDays(s, 6));
    return {s, ...m, ok: m.I.length > 0};
  });
}

function agrupar(rows, keyFn, valFn){
  const m = new Map();
  rows.forEach(r => { const k = keyFn(r); m.set(k, (m.get(k)||0) + valFn(r)); });
  return [...m.entries()].sort((x,y)=>y[1]-x[1]);
}

/* ================= Componentes ================= */
function delta(act, ant, txt, invertir){
  if(!(ant > 0) || !isFinite(act)) return `<p class="d">Sin ${txt||'periodo anterior'} comparable</p>`;
  const p = act/ant - 1; const bueno = invertir ? p <= 0 : p >= 0;
  return `<p class="d ${bueno?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p*100).toFixed(1)}% vs ${txt||'periodo anterior'}</p>`;
}

function barras(lista, total, clic){
  const m = Math.max(...lista.map(x=>x[1]), 1);
  return lista.map(([n,v]) => {
    const sel = FILTRO && FILTRO.valor===n;
    const on = clic && n!=='Otros' ? ` onclick="filtrar('${clic}','${jsq(n)}')"` : '';
    return `<div class="row ${on?'clic':''} ${sel?'sel':''}"${on} data-tip="${esc(n)} · ${MXN(v)}${total?` · ${PCT(v/total,1)}`:''}">
    <span class="n">${esc(n)}</span><span class="b"><i style="width:${Math.max(0.5, v/m*100).toFixed(1)}%"></i></span>
    <span class="v">${MXN(v)}${total?` <span style="color:var(--muted)">${PCT(v/total)}</span>`:''}</span></div>`;
  }).join('') || '<p class="note">Sin datos en el periodo</p>';
}

function topN(lista, n){
  if(lista.length <= n) return lista;
  const resto = lista.slice(n).reduce((s,x)=>s+x[1],0);
  return lista.slice(0,n).concat([['Otros', resto]]);
}

function rr(x, y, w, h, r){
  if(h <= 0) return '';
  r = Math.min(r, w/2, h);
  return `M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z`;
}

/* Columnas simples con línea de promedio */
function columnas(puntos, opt){
  opt = opt || {};
  if(!puntos.length) return '<p class="note">Sin datos en el periodo</p>';
  const W = 640, H = 190, top = 22, bot = 26, n = puntos.length;
  const gap = n > 20 ? 2 : 6, bw = (W - gap*(n-1))/n;
  const max = Math.max(...puntos.map(p=>p.v), 1) * 1.1;
  const y = v => top + (H - top - bot) * (1 - v/max);
  const prom = puntos.reduce((s,p)=>s+p.v,0)/n;
  const imax = puntos.reduce((b,p,i)=>p.v>puntos[b].v?i:b,0);
  const cada = Math.ceil(n/12);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.aria||'Gráfica')}">`;
  s += `<line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="var(--line)"/>`;
  puntos.forEach((p,i) => {
    const x = i*(bw+gap), yy = y(p.v);
    s += `<g data-tip="${esc(p.tip||p.label)} · ${MXN(p.v)}"><rect x="${x}" y="${top}" width="${bw}" height="${H-bot-top}" fill="transparent"/>`;
    s += `<path d="${rr(x, yy, bw, H-bot-yy, 4)}" fill="${i===imax?'var(--accent)':'var(--mark)'}"/></g>`;
    if(i===imax) s += `<text x="${x+bw/2}" y="${yy-6}" text-anchor="middle" font-size="11" font-weight="500" fill="var(--ink)">${K(p.v)}</text>`;
    if(i%cada===0 || i===n-1) s += `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(p.label)}</text>`;
  });
  if(opt.promedio !== false && n > 1){
    s += `<line x1="0" x2="${W}" y1="${y(prom)}" y2="${y(prom)}" stroke="var(--ink2)" stroke-dasharray="4 4" stroke-width="1"/>`;
    s += `<text x="${W}" y="${y(prom)-5}" text-anchor="end" font-size="10" fill="var(--ink2)">Promedio ${K(prom)}</text>`;
  }
  return s + '</svg>';
}

/* Venta y utilidad por semana: dos barras por semana, margen arriba */
function ventaUtilidad(sem, R){
  if(!sem.length) return '<p class="note">Sin datos</p>';
  const W = 640, H = 200, top = 26, bot = 28, n = sem.length, gg = 10;
  const grp = (W - gg*(n-1))/n, bw = Math.min(26, (grp-4)/2);
  const max = Math.max(...sem.map(x=>x.total), 1) * 1.1;
  const y = v => top + (H - top - bot) * (1 - Math.max(v,0)/max);
  const base = H - bot;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Venta y utilidad por semana">`;
  s += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  const cada = Math.ceil(n/12);
  sem.forEach((x,i) => {
    const cx = i*(grp+gg) + grp/2, en = x.s >= R.a && x.s <= R.b;
    const op = en ? 1 : 0.45;
    s += `<g opacity="${op}" data-tip="Semana vie ${corto(x.s)} · Venta ${MXN(x.total)}${x.ok?` · Utilidad ${MXN(x.utilidad)} · Margen ${x.total?PCT(x.utilidad/x.total,1):'—'}`:' · sin insumos capturados'}">
      <rect x="${cx-bw-2}" y="${top-10}" width="${bw*2+4}" height="${base-top+10}" fill="transparent"/>
      <path d="${rr(cx-bw-1, y(x.total), bw, base-y(x.total), 3)}" fill="var(--mark2)"/>`;
    if(x.ok){
      s += `<path d="${rr(cx+1, y(x.utilidad), bw, base-y(x.utilidad), 3)}" fill="${en && document.getElementById('periodo').value==='semana' ? 'var(--accent)' : 'var(--mark)'}"/>`;
      s += `<text x="${cx}" y="${y(x.total)-6}" text-anchor="middle" font-size="10" font-weight="500" fill="var(--ink)">${x.total?PCT(x.utilidad/x.total):''}</text>`;
    } else {
      s += `<text x="${cx}" y="${y(x.total)-6}" text-anchor="middle" font-size="10" fill="var(--down)">sin costos</text>`;
    }
    s += `</g>`;
    if(i%cada===0 || i===n-1) s += `<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="10" fill="var(--muted)">${corto(x.s)}</text>`;
  });
  return s + `</svg><div class="lgs"><span><span class="sw" style="background:var(--mark2)"></span> Venta</span><span><span class="sw" style="background:var(--mark)"></span> Utilidad</span><span>% = margen de la semana</span></div>`;
}

/* Cascada: de la venta a la utilidad */
function cascada(m){
  const pasos = [['Venta', m.total], ['Carne', -m.carne], ['Otros insumos', -m.otros], ['Gastos', -m.gastos], ['Sueldos', -m.sueldos]];
  const W = 420, H = 190, top = 20, bot = 26, n = 6, gap = 12, bw = (W - gap*(n-1))/n;
  const max = Math.max(m.total, 1) * 1.05, min = Math.min(0, m.utilidad);
  const y = v => top + (H - top - bot) * (max - v)/(max - min);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="De la venta a la utilidad">`;
  s += `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  let nivel = 0;
  pasos.forEach(([t, v], i) => {
    const x = i*(bw+gap);
    const a0 = i===0 ? 0 : nivel, a1 = i===0 ? v : nivel + v;
    nivel = a1;
    const y1 = y(Math.max(a0,a1)), y2 = y(Math.min(a0,a1));
    s += `<g data-tip="${t} · ${MXN(v)}"><rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1,y2-y1)}" rx="3" fill="${i===0?'var(--mark2)':'var(--neg)'}"/>
      <text x="${x+bw/2}" y="${y1-5}" text-anchor="middle" font-size="10" fill="var(--ink)">${i===0||v===0?'':'−'}${K(Math.abs(v))}</text></g>
      <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${t}</text>`;
  });
  const x = 5*(bw+gap), u = m.utilidad, y1 = y(Math.max(0,u)), y2 = y(Math.min(0,u));
  s += `<g data-tip="Utilidad · ${MXN(u)}"><rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(1,y2-y1)}" rx="3" fill="${u>=0?'var(--accent)':'var(--down)'}"/>
    <text x="${x+bw/2}" y="${y1-5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${K(u)}</text></g>
    <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink)">Utilidad</text>`;
  return s + '</svg>';
}

/* Líneas multiserie (máx. 5 series) con etiqueta al final */
function lineas(xs, series, fmtV, aria){
  if(!xs.length || !series.length) return '<p class="note">Sin datos en el periodo</p>';
  const W = 1100, H = 240, top = 14, bot = 26, left = 30, right = 130;
  const vals = series.flatMap(s=>s.v.filter(v=>v!=null));
  if(!vals.length) return '<p class="note">Sin datos en el periodo</p>';
  let mn = Math.min(...vals), mx = Math.max(...vals); const pad0 = (mx-mn)*0.15 || mx*0.1 || 1; mn -= pad0; mx += pad0;
  const X = i => left + (xs.length===1 ? (W-left-right)/2 : i*(W-left-right)/(xs.length-1));
  const Y = v => top + (H-top-bot)*(1-(v-mn)/(mx-mn));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(aria)}">`;
  s += `<line x1="${left}" x2="${W-right}" y1="${H-bot}" y2="${H-bot}" stroke="var(--line)"/>`;
  const cada = Math.ceil(xs.length/10);
  xs.forEach((x,i)=>{ if(i%cada===0 || i===xs.length-1) s += `<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(x)}</text>`; });
  const fin = [];
  series.forEach((se, k) => {
    const col = `var(--s${k+1})`;
    let d = ''; let pen = false;
    se.v.forEach((v,i)=>{ if(v==null){ pen = false; return; } d += `${pen?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)} `; pen = true; });
    s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.v.forEach((v,i)=>{ if(v==null) return;
      s += `<g data-tip="${esc(se.nombre)} · ${esc(xs[i])} · ${fmtV(v)}"><circle cx="${X(i)}" cy="${Y(v)}" r="10" fill="transparent"/><circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${col}" stroke="var(--card)" stroke-width="2"/></g>`; });
    const li = se.v.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
    if(li!=null && li>=0) fin.push({y: Y(se.v[li]), x: X(li), t: `${se.nombre} ${fmtV(se.v[li])}`, col});
  });
  // Etiquetas al final sin encimarse
  fin.sort((a,b)=>a.y-b.y); for(let i=1;i<fin.length;i++) if(fin[i].y - fin[i-1].y < 12) fin[i].y = fin[i-1].y + 12;
  fin.forEach(f=>{ s += `<text x="${W-right+8}" y="${f.y+4}" font-size="10" fill="var(--ink2)"><tspan fill="${f.col}">●</tspan> ${esc(f.t)}</text>`; });
  return s + '</svg>' + `<div class="lgs">${series.map((se,k)=>`<span><span class="sw" style="background:var(--s${k+1})"></span> ${esc(se.nombre)}</span>`).join('')}</div>`;
}

/* Barras apiladas por semana (costos) */
function apiladas(sem, capas){
  if(!sem.length) return '<p class="note">Sin datos</p>';
  const W = 640, H = 200, top = 16, bot = 26, n = sem.length, gap = n>16?3:8, bw = (W-gap*(n-1))/n;
  const tot = sem.map(x=>capas.reduce((s,c)=>s+x[c.k],0));
  const max = Math.max(...tot, 1)*1.08;
  const Y = v => (H-top-bot)*(v/max);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Costo por semana">`;
  s += `<line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="var(--line)"/>`;
  const cada = Math.ceil(n/12);
  sem.forEach((x,i)=>{
    let yb = H-bot; const xx = i*(bw+gap);
    s += `<g data-tip="vie ${corto(x.s)} · ${capas.map(c=>`${c.n} ${MXN(x[c.k])}`).join(' · ')} · Total ${MXN(tot[i])}"><rect x="${xx}" y="${top}" width="${bw}" height="${H-bot-top}" fill="transparent"/>`;
    capas.forEach((c,k)=>{ const h = Y(x[c.k]); if(h<=0) return; yb -= h; s += `<rect x="${xx}" y="${yb}" width="${bw}" height="${Math.max(0,h-2)}" fill="var(--s${k+1})"/>`; });
    s += `</g>`;
    if(tot[i]===0) s += `<text x="${xx+bw/2}" y="${H-bot-6}" text-anchor="middle" font-size="9" fill="var(--down)">sin datos</text>`;
    if(i%cada===0 || i===n-1) s += `<text x="${xx+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${corto(x.s)}</text>`;
  });
  return s + `</svg><div class="lgs">${capas.map((c,k)=>`<span><span class="sw" style="background:var(--s${k+1})"></span> ${c.n}</span>`).join('')}</div>`;
}

/* Mapa de calor día × hora */
function mapaCalor(m){
  const rows = m.V; if(!rows.length) return '<p class="note">Sin datos</p>';
  const cel = {}, dias = new Set(), horas = new Set();
  rows.forEach(r=>{ const d = dow(r[0].slice(0,10)), h = parseInt(r[0].slice(11,13),10); if(!isFinite(h)) return;
    dias.add(d); horas.add(h); const k = d+'_'+h; cel[k] = (cel[k]||0) + num(r[7]); });
  const orden = [5,6,0,1,2,3,4].filter(d=>dias.has(d));
  const hs = [...horas].sort((a,b)=>a-b); if(!hs.length) return '<p class="note">Sin hora registrada</p>';
  const lista = []; for(let h=hs[0]; h<=hs[hs.length-1]; h++) lista.push(h);
  const max = Math.max(...Object.values(cel), 1);
  const cw = 44, ch = 30, lw = 60, W = lw + lista.length*cw, H = 20 + orden.length*ch;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W*1.4}px" role="img" aria-label="Venta por día y hora">`;
  lista.forEach((h,i)=>{ s += `<text x="${lw+i*cw+cw/2}" y="12" text-anchor="middle" font-size="10" fill="var(--muted)">${h}:00</text>`; });
  orden.forEach((d,j)=>{
    s += `<text x="0" y="${20+j*ch+ch/2+4}" font-size="11" fill="var(--ink2)">${DIAS_L[d]}</text>`;
    lista.forEach((h,i)=>{ const v = cel[d+'_'+h]||0, a = v ? 0.12 + 0.88*(v/max) : 0;
      s += `<g data-tip="${DIAS_L[d]} ${h}:00 · ${MXN(v)}"><rect x="${lw+i*cw+1}" y="${20+j*ch+1}" width="${cw-2}" height="${ch-2}" rx="4" fill="${v?'var(--accent)':'var(--track)'}" fill-opacity="${v?a.toFixed(2):1}"/>
      ${v/max>0.55?`<text x="${lw+i*cw+cw/2}" y="${20+j*ch+ch/2+4}" text-anchor="middle" font-size="9" fill="#fff">${K(v)}</text>`:''}</g>`; });
  });
  return s + '</svg><p class="note">Más oscuro = más venta. Suma de todo el periodo.</p>';
}

function pagos(m){
  const COL = {Efectivo:'var(--mark)', Tarjeta:'var(--accent)', Transferencia:'var(--mark2)'};
  const l = agrupar(m.V, r=>r[8]||'Sin método', r=>num(r[7]));
  if(!l.length) return '<p class="note">Sin datos</p>';
  return `<div class="stack">${l.map(([k,v])=>`<span data-tip="${esc(k)} · ${MXN(v)}" style="width:${(v/m.total*100).toFixed(2)}%;background:${COL[k]||'var(--muted)'}"></span>`).join('')}</div>` +
    l.map(([k,v])=>`<div class="lg"><span class="sw" style="background:${COL[k]||'var(--muted)'}"></span><span style="flex:1">${esc(k)}</span><span>${MXN(v)} · ${PCT(v/m.total)}</span></div>`).join('');
}


/* ================= Qué revisar: alertas por pestaña ================= */
// Umbrales acordados. Cambia aquí si alguna alerta sale demasiado seguido o muy poco.
const UMBRAL = {
  prodPct: 0.20,     // producto sube o cae 20% o más…
  prodPeso: 0.03,    // …y pesa al menos 3% de la venta…
  prodMonto: 300,    // …o cambia más de $300
  ticketPct: 0.10,   // ticket promedio ±10%
  ventaPct: 0.10,    // venta total ±10%
  carneVenta: 0.55,  // carne arriba de 55% de la venta
  precioKg: 0.05,    // precio de compra por kilo ±5%
  margenPts: 3,      // margen ±3 puntos vs promedio de 4 semanas
  costoPct: 0.15,    // costo total ±15%
  rendPts: 8,        // rendimiento de la carne ±8 puntos vs 4 semanas previas
  horaMin: 9         // ventas antes de esta hora = probable desfase de horario
};
const SEV_ORDEN = {dn:0, wa:1, up:2};
const SEV_IC = {dn:'▼', wa:'!', up:'▲'};
const flag = (sev, html) => ({sev, html});
const pctTxt = p => `${Math.abs(p*100).toFixed(0)}%`;
const diaCorto = s => `${DIAS[dow(s.slice(0,10))].toLowerCase()} ${corto(s.slice(0,10))}`;
const normTxt = s => String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const verMenor = (v, ref) => { const a = String(v||'0').split('.').map(Number), b = ref.split('.').map(Number); for(let i=0;i<b.length;i++){ if((a[i]||0)!==b[i]) return (a[i]||0) < b[i]; } return false; };

function tarjetaAlertas(tab, lista, R){
  // Máximo 5, de lo más grave a lo positivo; si hay algo positivo, siempre se muestra al menos uno
  const orden = lista.filter(Boolean).sort((a,b)=>SEV_ORDEN[a.sev]-SEV_ORDEN[b.sev]);
  const malas = orden.filter(f=>f.sev!=='up'), buenas = orden.filter(f=>f.sev==='up');
  const l = malas.slice(0, buenas.length ? 4 : 5).concat(buenas).slice(0,5);
  const cuerpo = l.length
    ? l.map(f=>`<div class="fl"><span class="ic ${f.sev}" aria-hidden="true">${SEV_IC[f.sev]}</span><span>${f.html}</span></div>`).join('')
    : '<p class="note" style="margin:0">Todo en orden en este periodo.</p>';
  return `<div class="card" style="margin-bottom:12px"><h3>Qué revisar · ${tab} <small>vs vie ${corto(R.pa)} – jue ${corto(R.pb)}</small></h3>${cuerpo}</div>`;
}

/* Renglones de Surtido repartidos por la v2.2 (uno por corte) → una sola venta para mostrarlos.
   No cambia totales; solo agrupa los renglones seguidos del mismo ticket. */
const CORTES_REPARTO = ['Pierna','Buche','Nuca','Aldilla','Costilla'];
function juntarSurtido(rows){
  const out = []; let g = null;
  const cerrar = () => { if(!g) return; const b = g.f[0].slice(); b[3] = 'Surtido'; b[4] = 'Surtido';
    b[5] = Math.round(g.f.reduce((s,r)=>s+num(r[5]),0)*1000)/1000; b[7] = g.f.reduce((s,r)=>s+num(r[7]),0); out.push(b); g = null; };
  rows.forEach(r=>{
    const corte = r[4]==='Surtido' && r[2]==='Carne' && CORTES_REPARTO.includes(r[3]);
    if(!corte){ cerrar(); out.push(r); return; }
    if(g && (g.t!==r[1] || g.c[r[3]])) cerrar();
    if(!g) g = {t:r[1], c:{}, f:[]};
    g.c[r[3]] = true; g.f.push(r);
  });
  cerrar();
  return out;
}

/* Tickets idénticos a otro capturado menos de 60 s antes (posible doble toque al cobrar) */
function doblesCaptura(V){
  const tk = new Map();
  V.forEach(r=>{ if(!r[1]) return; const o = tk.get(r[1]) || {f:r[0], l:[], t:0}; o.l.push(prodKey(r)+':'+num(r[7])); o.t += num(r[7]); tk.set(r[1], o); });
  const lista = [...tk.entries()].map(([id,o])=>({id, f:o.f, t:o.t, firma:o.l.sort().join('|'), ms: Date.parse(o.f.replace(' ','T'))})).filter(x=>isFinite(x.ms)).sort((a,b)=>a.ms-b.ms);
  const dobles = [];
  for(let i=1;i<lista.length;i++) if(lista[i].firma===lista[i-1].firma && lista[i].ms-lista[i-1].ms <= 60000) dobles.push(lista[i]);
  return dobles;
}

/* Mismo concepto y mismo monto dos veces en el periodo */
function duplicados(rows, nombreFn, montoIdx){
  const m = new Map();
  rows.forEach(r=>{ const monto = num(r[montoIdx]); if(!(monto>0)) return; const k = normTxt(nombreFn(r))+'|'+monto; const o = m.get(k) || {nombre:nombreFn(r), monto, rows:[]}; o.rows.push(r); m.set(k,o); });
  return [...m.values()].filter(o=>o.rows.length>1);
}
const dupInsumos = I => duplicados(I, r=>r[2]||r[1], 6);
const dupGastos = G => duplicados(G, r=>r[2]||r[1], 3);

function precioPorCorte(I){
  const o = {};
  I.filter(r=>r[1]==='Carne' && CORTES_COCCION.includes(r[2])).forEach(r=>{ o[r[2]] = o[r[2]] || {kg:0,c:0}; o[r[2]].kg += num(r[3]); o[r[2]].c += num(r[6]); });
  return o;
}

function alertasVentas(m, ant){
  const out = [];
  if(ant.total > 0){
    const a = new Map(agrupar(ant.V, prodKey, r=>num(r[7]))), b = new Map(agrupar(m.V, prodKey, r=>num(r[7])));
    const movs = [];
    new Set([...a.keys(), ...b.keys()]).forEach(k=>{
      const va = a.get(k)||0, vb = b.get(k)||0, d = vb - va;
      const peso = Math.max(m.total ? vb/m.total : 0, va/ant.total);
      const p = va > 0 ? d/va : Infinity;
      if(Math.abs(p) >= UMBRAL.prodPct && (peso >= UMBRAL.prodPeso || Math.abs(d) >= UMBRAL.prodMonto)) movs.push({k, va, vb, d, p});
    });
    const catDe = new Map(ant.V.concat(m.V).map(r=>[prodKey(r), r[2]]));
    movs.forEach(x=>{ if(['Medio','Litro','Vaso'].includes(x.k) && catDe.get(x.k)) x.k = `${catDe.get(x.k)} (${x.k.toLowerCase()})`; });
    const bajas = movs.filter(x=>x.d<0).sort((x,y)=>x.d-y.d), subidas = movs.filter(x=>x.d>0).sort((x,y)=>y.d-x.d);
    if(bajas[0]){ const x = bajas[0];
      out.push(flag('dn', `<b>${esc(x.k)}</b> cayó <b>${pctTxt(x.p)}</b> (${MXN(x.va)} → ${MXN(x.vb)})${x.vb && m.total ? ` y es el ${PCT(x.vb/m.total)} de la venta` : ''}.`)); }
    if(bajas.length > 1) out.push(flag('dn', bajas.slice(1,3).map(x=>`<b>${esc(x.k)} −${pctTxt(x.p)}</b>`).join(' y ') + ' vs el periodo anterior.'));
    if(subidas.length) out.push(flag('up', subidas.slice(0,2).map(x=>`<b>${esc(x.k)}</b> ${x.va ? `subió de ${MXN(x.va)} a <b>${MXN(x.vb)}</b>` : `aparece con <b>${MXN(x.vb)}</b>`}`).join(' y ') + '.'));
  } else if(m.total > 0){
    out.push(flag('wa', 'Sin ventas en el periodo anterior para comparar productos.'));
  }
  const tp = m.tickets ? m.total/m.tickets : 0, tpa = ant.tickets ? ant.total/ant.tickets : 0;
  if(tp && tpa){
    const p = tp/tpa - 1;
    if(Math.abs(p) >= UMBRAL.ticketPct){
      const dt = m.tickets/ant.tickets - 1;
      const lectura = Math.abs(dt) < 0.05 ? (p<0 ? ': la gente llevó menos, no vinieron menos' : ': la gente llevó más con los mismos clientes')
                                          : ` (tickets ${dt>=0?'+':'−'}${pctTxt(dt)})`;
      out.push(flag(p<0?'dn':'up', `<b>Ticket promedio</b> ${p<0?'bajó':'subió'} <b>${pctTxt(p)}</b> (${MXN(tpa)} → ${MXN(tp)})${lectura}.`));
    }
  }
  if(m.P.length){
    const c = agrupar(m.P, r=>r[1]||'Sin categoría', ()=>1)[0]; const kg = m.P.reduce((s,r)=>s+num(r[2]),0);
    out.push(flag('wa', `<b>${m.P.length} ${m.P.length===1?'venta perdida':'ventas perdidas'}</b>${c?`, sobre todo de ${esc(c[0])}`:''}${kg?` (${kg.toFixed(2)} kg)`:''}: revisa si conviene producir más.`));
  } else if(ant.P.length){
    out.push(flag('wa', `<b>0 ventas perdidas</b> registradas (${ant.P.length} en el periodo anterior). Si se acabó algo, captúralo para medir faltantes.`));
  }
  return out;
}

function alertasCostos(m, ant, R){
  if(FILTRO) return [flag('wa', 'Quita el filtro para ver las alertas de costos.')];
  const out = [];
  if(m.sinCostos.length) out.push(flag('dn', `${m.sinCostos.length===1?'La semana':'Las semanas'} del ${m.sinCostos.map(s=>'vie '+corto(s)).join(', ')} ${m.sinCostos.length===1?'tiene':'tienen'} ventas pero <b>no insumos capturados</b>: la utilidad no es confiable.`));
  if(m.total && m.I.length){
    const p = m.carne/m.total;
    if(p > UMBRAL.carneVenta) out.push(flag('dn', `<b>Carne</b> = <b>${PCT(p)}</b> de la venta (${MXN(m.carne)} de ${MXN(m.total)}). Arriba de ${PCT(UMBRAL.carneVenta)} es alerta.`));
  }
  const pa = precioPorCorte(m.I), pb = precioPorCorte(ant.I), cambios = [];
  Object.keys(pa).forEach(k=>{ if(pb[k] && pa[k].kg && pb[k].kg){ const a1 = pa[k].c/pa[k].kg, b1 = pb[k].c/pb[k].kg, d = a1/b1 - 1; if(Math.abs(d) >= UMBRAL.precioKg) cambios.push({k, a1, b1, d}); } });
  cambios.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).forEach(x=>out.push(flag(x.d>0?'dn':'up', `${x.d>0?'Subió':'Bajó'} el precio de <b>${esc(x.k)}</b> ${pctTxt(x.d)} (${MXN(x.b1)} → ${MXN(x.a1)} por kilo).`)));
  if(!cambios.length && Object.keys(pa).length && Object.keys(pb).length) out.push(flag('up', 'Precios de compra por kilo sin cambios de 5% o más.'));
  if(m.kgComp > 0 && m.kgVend > 0){
    const rend = m.kgVend/m.kgComp;
    const prev = porSemana(addDays(R.a, -28), addDays(R.a, -1)).filter(x=>x.kgComp>0 && x.kgVend>0);
    if(prev.length >= 2){
      const pr = prev.reduce((s,x)=>s+x.kgVend/x.kgComp,0)/prev.length, dif = (rend-pr)*100;
      if(dif <= -UMBRAL.rendPts) out.push(flag('wa', `<b>Rendimiento</b> de ${PCT(rend)} vs ${PCT(pr)} en las 4 semanas previas: compraste ${m.kgComp.toFixed(0)} kg en crudo; revisa cuánto sobró o si hubo merma.`));
      else if(dif >= UMBRAL.rendPts) out.push(flag('up', `<b>Rendimiento</b> de ${PCT(rend)} vs ${PCT(pr)} en las 4 semanas previas.`));
    }
  }
  const huecos = porSemana(R.pa, R.b).filter(x=>x.total>0 && x.I.length && (x.otros + x.gastos)===0).map(x=>x.s);
  if(huecos.length) out.push(flag('wa', `${huecos.length===1?'La semana':'Las semanas'} del ${huecos.map(s=>'vie '+corto(s)).join(', ')} no ${huecos.length===1?'tiene':'tienen'} <b>otros insumos ni gastos</b> capturados: su margen sale inflado.`));
  const sinSueldo = porSemana(R.a, R.b).filter(x=>x.total>0 && !x.S.length).map(x=>x.s);
  if(sinSueldo.length) out.push(flag('wa', `Sin <b>sueldos</b> capturados en la semana del ${sinSueldo.map(s=>'vie '+corto(s)).join(', ')}.`));
  if(ant.costos > 0 && m.costos > 0){
    const p = m.costos/ant.costos - 1;
    if(Math.abs(p) >= UMBRAL.costoPct) out.push(flag(p>0?'wa':'up', `<b>Costo total</b> ${p>0?'subió':'bajó'} ${pctTxt(p)} (${MXN(ant.costos)} → ${MXN(m.costos)}).`));
  }
  return out;
}

function alertasDatos(m, R){
  const out = [];
  if(SERVICIO && verMenor(SERVICIO.version, '2.3')) out.push(flag('dn', `El servicio de Apps Script está en la <b>versión ${esc(SERVICIO.version||'anterior')}</b>: publica el <code>Code.gs</code> 2.3.0 (Gestionar implementaciones → ✏️ → Nueva versión). Mientras, las horas pueden salir desfasadas.`));
  const V0 = enRango(RAW.Ventas, R.a, R.b).filter(r=>r[2]!=='Regalo');
  const temprano = V0.filter(r=>{ const h = parseInt(r[0].slice(11,13),10); return isFinite(h) && h < UMBRAL.horaMin && r[0].slice(11,19)!=='00:00:00'; });
  if(temprano.length) out.push(flag('dn', `<b>${temprano.length} ${temprano.length===1?'venta':'ventas'} antes de las ${UMBRAL.horaMin}:00</b>. Si no abriste a esa hora, las horas vienen desfasadas: revisa la versión del servicio y la zona horaria de la hoja.`));
  const noOp = agrupar(V0.filter(r=>![6,0].includes(dow(r[0].slice(0,10)))), r=>r[0].slice(0,10), r=>num(r[7]));
  if(noOp.length) out.push(flag('wa', `Ventas en día no operativo: ${noOp.map(([d,v])=>`<b>${diaCorto(d)}, ${MXN(v)}</b>`).join(' · ')}. ¿Pruebas o venta real?`));
  dupInsumos(m.I).forEach(g=>out.push(flag('wa', `Posible <b>duplicado en Insumos</b>: ${esc(g.nombre)} por ${MXN(g.monto)} ${g.rows.map(r=>`el ${diaCorto(r[0])}${r[7]?` (${esc(r[7])})`:''}`).join(' y ')}.`)));
  dupGastos(m.G).forEach(g=>out.push(flag('wa', `Posible <b>duplicado en Gastos</b>: ${esc(g.nombre)} por ${MXN(g.monto)} ${g.rows.map(r=>`el ${diaCorto(r[0])}`).join(' y ')}.`)));
  const dobles = doblesCaptura(V0);
  if(dobles.length) out.push(flag('wa', `<b>${dobles.length} ${dobles.length===1?'ticket idéntico':'tickets idénticos'}</b> a otro cobrado menos de un minuto antes (${dobles.slice(0,3).map(t=>`${diaCorto(t.f)} ${t.f.slice(11,16)} · ${MXN(t.t)}`).join(', ')}): ¿doble toque al cobrar?`));
  const otro = m.I.filter(r=>/^otros?$/i.test(String(r[2]).trim()));
  if(otro.length) out.push(flag('wa', `<b>${otro.length} ${otro.length===1?'insumo':'insumos'}</b> con producto "Otro" (${MXN(otro.reduce((s,r)=>s+num(r[6]),0))}): no entran al rendimiento de la carne.`));
  const sinCosto = m.I.filter(r=>!(num(r[6])>0));
  if(sinCosto.length) out.push(flag('wa', `<b>${sinCosto.length} ${sinCosto.length===1?'insumo':'insumos'} sin costo</b> capturado: ${sinCosto.slice(0,3).map(r=>esc(r[2])).join(', ')}.`));
  const sinPago = V0.filter(r=>!r[8]).length;
  if(sinPago) out.push(flag('wa', `<b>${sinPago} ${sinPago===1?'venta':'ventas'} sin método de pago</b>.`));
  if(SERVICIO && SERVICIO.tz && SERVICIO.tz!=='America/Mexico_City') out.push(flag('wa', `La hoja está en la zona horaria <b>${esc(SERVICIO.tz)}</b>: ejecuta <code>ajustarZonaHoraria()</code> en Apps Script.`));
  if(!out.length) out.push(flag('up', 'Captura sin problemas detectados: horas normales, sin duplicados y todas las ventas con método de pago.'));
  return out;
}

function alertasResumen(m, ant, R){
  const out = [];
  if(!FILTRO && m.I.length && m.total > 0){
    const mg = m.utilidad/m.total;
    const sem = porSemana(addDays(R.a, -28), addDays(R.a, -1)).filter(x=>x.ok && x.total>0);
    const prom = sem.length >= 2 ? sem.reduce((s,x)=>s+x.utilidad/x.total,0)/sem.length : null;
    if(mg < 0) out.push(flag('dn', `Margen de <b>${PCT(mg,1)}</b>: los costos superaron a la venta por ${MXN(-m.utilidad)}${prom!=null?` (promedio de las 4 semanas previas: ${PCT(prom,1)})`:''}.`));
    else if(prom != null && Math.abs(mg-prom)*100 >= UMBRAL.margenPts) out.push(flag(mg>prom?'up':'dn', `Margen de <b>${PCT(mg,1)}</b>, ${mg>prom?'arriba':'abajo'} del promedio de las 4 semanas previas (${PCT(prom,1)}) por <b>${(Math.abs(mg-prom)*100).toFixed(1)} puntos</b>.`));
  }
  if(ant.total > 0){
    const p = m.total/ant.total - 1;
    if(Math.abs(p) >= UMBRAL.ventaPct) out.push(flag(p<0?'dn':'up', `Venta <b>${p<0?'−':'+'}${(Math.abs(p)*100).toFixed(1)}%</b>: ${MXN(m.total)} vs ${MXN(ant.total)}${m.tickets===ant.tickets?`, con los mismos ${m.tickets} tickets`:` (${m.tickets} tickets vs ${ant.tickets})`}.`));
  }
  // Lo más importante de las otras pestañas
  const primera = l => l.filter(f=>f.sev!=='up').sort((a,b)=>SEV_ORDEN[a.sev]-SEV_ORDEN[b.sev])[0];
  [primera(alertasDatos(m, R)), primera(alertasCostos(m, ant, R)), primera(alertasVentas(m, ant))].forEach(f=>{ if(f && !out.some(o=>o.html===f.html)) out.push(f); });
  const prom = d => { const dd = m.dias.filter(x=>dow(x)===d); return dd.length ? m.V.filter(r=>dd.includes(r[0].slice(0,10))).reduce((s,r)=>s+num(r[7]),0)/dd.length : 0; };
  const sab = prom(6), dom = prom(0);
  if(sab > 0 && dom > 0) out.push(flag('up', `<b>${dom>sab?'Domingo':'Sábado'}</b> fue el día más fuerte: ${MXN(Math.max(sab,dom))} vs ${MXN(Math.min(sab,dom))}${m.dias.length>2?' en promedio':''}.`));
  return out;
}

function vVentas(m, ant, R){
  const porHora = {}; m.V.forEach(r=>{ const h = parseInt(r[0].slice(11,13),10); if(isFinite(h)) porHora[h] = (porHora[h]||0) + num(r[7]); });

  // Ranking con regla 80/20

  // Tickets

  const regalo = m.regalos.reduce((s,r)=>s+num(r[5]),0);

    <div class="kpi"><p class="l">Productos por ticket</p><p class="v">${lineas.toFixed(1)}</p><p class="d">${m.tickets} tickets</p></div>
    <div class="kpi"><p class="l">Carne vendida</p><p class="v">${m.kgVend.toFixed(1)} kg</p>${delta(m.kgVend, ant.kgVend)}</div>
  </div>
  <div class="g2">
    <div class="card"><h3>Venta por día y hora</h3>${mapaCalor(m)}</div>
    <div class="card"><h3>Venta promedio por hora <small>por día operado</small></h3>${columnas(pH, {aria:'Venta por hora', promedio:false})}</div>
  </div>
  <div class="card" style="margin-bottom:12px"><h3>Ranking de productos <small>${corte>=0 ? `${corte+1} de ${prods.length} productos hacen el 80% de la venta · clic para filtrar` : 'clic para filtrar'}</small></h3>
    <table><tr><th>#</th><th>Producto</th><th>Categoría</th><th class="r">Kilos</th><th class="r">Piezas</th><th class="r">Venta</th><th class="r">%</th><th class="r">% acumulado</th></tr>
    ${prods.map(([p,o],i)=>`<tr class="clic ${i===corte?'corte':''}" onclick="filtrar('prod','${jsq(p)}')"><td style="color:var(--muted)">${i+1}</td><td>${esc(p)}</td><td style="color:var(--ink2)">${esc(o.cat)}</td><td class="r">${o.kg?o.kg.toFixed(1):'–'}</td><td class="r">${o.pz?(+o.pz.toFixed(1)).toLocaleString('es-MX'):'–'}</td><td class="r">${MXN(o.v)}</td><td class="r">${PCT(m.total?o.v/m.total:0,1)}</td><td class="r">${PCT(o.acum,0)}</td></tr>`).join('')}</table>
    ${corte>=0?'<p class="note">La línea naranja marca dónde se alcanza el 80% de la venta.</p>':''}</div>
  <div class="g2e">
    <div class="card"><h3>Tickets más grandes</h3>
      <table><tr><th>Fecha</th><th class="r">Productos</th><th class="r">Total</th><th>Pago</th></tr>
      ${grandes.map(x=>`<tr><td>${DIAS[dow(x.f.slice(0,10))]} ${corto(x.f.slice(0,10))} ${esc(x.f.slice(11,16))}</td><td class="r">${x.n}</td><td class="r">${MXN(x.t)}</td><td>${esc(x.p)}</td></tr>`).join('')}</table></div>
    <div class="card"><h3>Ventas perdidas <small>${m.P.length} registros</small></h3>
      ${vp.size ? `<table><tr><th>Categoría</th><th class="r">Veces</th><th class="r">Kilos</th><th class="r">Piezas</th><th class="r">Monto</th></tr>
      ${[...vp.entries()].sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>`<tr><td>${esc(k)}</td><td class="r">${o.n}</td><td class="r">${o.kg?o.kg.toFixed(2):'–'}</td><td class="r">${o.pz||'–'}</td><td class="r">${o.mt?MXN(o.mt):'–'}</td></tr>`).join('')}</table>` : '<p class="note">Sin ventas perdidas en el periodo</p>'}
      ${regalo ? `<p class="note">Tacos regalados en el periodo: ${regalo}</p>` : ''}</div>
  </div>`;
}

function vCostos(m, ant, R){
  const sem = porSemana(document.getElementById('periodo').value==='semana' ? addDays(R.a, -7*7) : R.a, R.b);
  const nSem = Math.max(R.semanas, 1);
  const rend = m.kgComp ? m.kgVend/m.kgComp : 0;
  const costoKg = m.kgVend ? m.carne/m.kgVend : 0, costoKgAnt = ant.kgVend ? ant.carne/ant.kgVend : 0;
  // Punto de equilibrio semanal: la carne es costo variable (proporcional a la venta); lo demás es fijo por semana
  const semOk = sem.filter(x=>x.ok && x.total>0 && x.s>=R.a && x.s<=R.b);
  let pe = null, ventaProm = null;
  if(semOk.length){
    const v = semOk.reduce((s,x)=>s+x.total,0), c = semOk.reduce((s,x)=>s+x.carne,0), f = semOk.reduce((s,x)=>s+x.otros+x.gastos+x.sueldos,0);
    const ratio = v ? c/v : 0; ventaProm = v/semOk.length;
    if(ratio < 1) pe = (f/semOk.length)/(1-ratio);
  }
  // Precio por kilo por corte, por semana
  const cortes = agrupar(RAW.Insumos.filter(r=>r[1]==='Carne' && CORTES_COCCION.includes(r[2]) && r[0].slice(0,10)>=sem[0]?.s && r[0].slice(0,10)<=R.b), r=>r[2], r=>num(r[3])).slice(0,5).map(x=>x[0]);
  const series = cortes.map(c=>({nombre:c, v: sem.map(x=>{ const rs = x.I.filter(r=>r[1]==='Carne' && r[2]===c); const kg = rs.reduce((s,r)=>s+num(r[3]),0); return kg ? rs.reduce((s,r)=>s+num(r[6]),0)/kg : null; })}));
  const prov = agrupar(m.I, r=>r[7]||'Sin proveedor', r=>num(r[6]));
  const cortesTab = new Map(), cortesAnt = new Map();
  m.I.filter(r=>r[1]==='Carne').forEach(r=>{ const o = cortesTab.get(r[2]) || {kg:0,c:0}; o.kg += num(r[3]); o.c += num(r[6]); cortesTab.set(r[2], o); });
  ant.I.filter(r=>r[1]==='Carne').forEach(r=>{ const o = cortesAnt.get(r[2]) || {kg:0,c:0}; o.kg += num(r[3]); o.c += num(r[6]); cortesAnt.set(r[2], o); });
  const gCat = agrupar(m.G, r=>r[1]||'Otros', r=>num(r[3]));
  const sPer = agrupar(m.S, r=>r[1]||'-', r=>num(r[4]));
  const fila = (n, v, cls) => `<tr class="${cls||''}"><td>${n}</td><td class="r">${MXN(v)}</td><td class="r" style="color:var(--muted)">${m.total?PCT(v/m.total):''}</td></tr>`;
  return `
  ${tarjetaAlertas('Costos', alertasCostos(m, ant, R), R)}
  ${FILTRO ? '<p class="note" style="margin:-4px 0 10px">El filtro solo aplica a ventas; los costos se muestran completos.</p>' : ''}
  <div class="kpis">
    <div class="kpi"><p class="l">Costo total</p><p class="v">${MXN(m.costos)}</p>${delta(m.costos, ant.costos, 'periodo anterior', true)}</div>
    <div class="kpi"><p class="l">Costo de carne por kilo vendido</p><p class="v">${costoKg ? MXN(costoKg) : '—'}</p>${costoKg && costoKgAnt ? delta(costoKg, costoKgAnt, 'periodo anterior', true) : '<p class="d">Carne comprada ÷ kilos vendidos</p>'}</div>
    <div class="kpi"><p class="l">Rendimiento de la carne</p><p class="v">${m.kgComp ? PCT(rend) : '—'}</p><p class="d">${m.kgVend.toFixed(1)} kg vendidos / ${m.kgComp.toFixed(1)} kg en crudo</p></div>
    <div class="kpi hl"><p class="l">Punto de equilibrio semanal</p><p class="v">${pe!=null ? MXN(pe) : '—'}</p><p class="d">${pe!=null ? (ventaProm>=pe ? `Vendes ${MXN(ventaProm)} en promedio: ${PCT(ventaProm/pe-1)} arriba` : `Vendes ${MXN(ventaProm)}: te faltan ${MXN(pe-ventaProm)}`) : 'Faltan semanas con costos capturados'}</p></div>
  </div>
  <div class="g2">
    <div class="card"><h3>Costo por semana</h3>${apiladas(sem, [{k:'carne',n:'Carne'},{k:'otros',n:'Otros insumos'},{k:'gastos',n:'Gastos'},{k:'sueldos',n:'Sueldos'}])}</div>
    <div class="card"><h3>Estado de resultados del periodo</h3>
      <table class="pl"><tr><th></th><th class="r">Monto</th><th class="r">% ventas</th></tr>
      ${fila('Ventas', m.total)}${fila('− Carne', m.carne)}${fila('− Otros insumos', m.otros)}${fila('− Gastos', m.gastos)}${fila('− Sueldos', m.sueldos)}
      ${fila('Utilidad', m.utilidad, 'tot')}</table>
      <p class="note">Punto de equilibrio: la carne se toma como costo variable (sube con la venta) y lo demás como fijo por semana.</p></div>
  </div>
  <div class="card" style="margin-bottom:12px"><h3>Evolución del precio por kilo <small>cortes principales, por semana</small></h3>${lineas(sem.map(x=>corto(x.s)), series, v=>MXN(v), 'Precio por kilo por corte')}</div>
  <div class="g3">
    <div class="card"><h3>Compra de carne por corte</h3>
      ${cortesTab.size ? `<table><tr><th>Corte</th><th class="r">Kg</th><th class="r">$/kg</th><th class="r">vs ant.</th></tr>
      ${[...cortesTab.entries()].sort((a,b)=>b[1].c-a[1].c).map(([k,o])=>{ const p = o.kg?o.c/o.kg:0, b0 = cortesAnt.get(k), pb = b0&&b0.kg?b0.c/b0.kg:0, d = pb?p/pb-1:null;
        return `<tr><td>${esc(k)}</td><td class="r">${o.kg.toFixed(1)}</td><td class="r">${MXN(p)}</td><td class="r" style="color:${d==null||Math.abs(d)<0.005?'var(--muted)':d>0?'var(--down)':'var(--up)'}">${d==null?'–':Math.abs(d)<0.005?'0%':(d>0?'▲':'▼')+Math.abs(d*100).toFixed(0)+'%'}</td></tr>`; }).join('')}</table>` : '<p class="note">Sin compras de carne</p>'}</div>
    <div class="card"><h3>Compras por proveedor</h3>${barras(prov, m.I.reduce((s,r)=>s+num(r[6]),0))}</div>
    <div class="card"><h3>Gastos por categoría</h3>${barras(gCat, 0)}<h3 style="margin-top:18px">Nómina por persona</h3>${barras(sPer, 0)}</div>
  </div>`;
}

const TABLAS = [['Ventas','Ventas'],['Insumos','Insumos'],['Gastos','Gastos'],['Sueldos','Sueldos'],['VentasPerdidas','V. perdidas']];
const LIM_FILAS = 300;
const fechaCelda = s => { const t = s.slice(11,16); return diaCorto(s) + (t && s.slice(11,19)!=='00:00:00' ? ` · ${t}` : ''); };
const cant = v => { const n = num(v); return n ? (+n.toFixed(3)).toLocaleString('es-MX') : '–'; };
const tag = t => `<span class="tag">${t}</span>`;

function verTabla(t){ TABLA = t; render(); }

function filasTabla(t, m){
  if(t==='Ventas') return juntarSurtido(m.V);
  return {Insumos:m.I, Gastos:m.G, Sueldos:m.S, VentasPerdidas:m.P}[t] || [];
}

function vDatos(m, ant, R){
  const all = RAW.Ventas;
  const sinModo = all.filter(r=>!r[4] && r[2]!=='Regalo').length;
  const sinPago = all.filter(r=>!r[8]).length;
  const cero = all.filter(r=>num(r[7])<=0 && r[2]!=='Regalo').length;
  const fechas = all.map(r=>r[0].slice(0,10)).sort();
  const semS = new Set(all.map(r=>semanaDe(r[0].slice(0,10)))), semI = new Set(RAW.Insumos.map(r=>semanaDe(r[0].slice(0,10)))), semN = new Set(RAW.Sueldos.map(r=>semanaDe(r[0].slice(0,10))));
  const faltaI = [...semS].filter(s=>!semI.has(s)).sort(), faltaN = [...semS].filter(s=>!semN.has(s)).sort();
  const repartidos = all.filter(r=>r[4]==='Surtido' && CORTES_REPARTO.includes(r[3])).length;

  if(!TABLAS.some(([k])=>k===TABLA)) TABLA = 'Ventas';
  const seg = TABLAS.map(([k,t])=>`<button class="${k===TABLA?'on':''}" onclick="verTabla('${k}')">${t}<em>${filasTabla(k, m).length}</em></button>`).join('');
  const filas = filasTabla(TABLA, m).slice().sort((a,b)=>a[0]<b[0]?1:a[0]>b[0]?-1:0);
  const vista = filas.slice(0, LIM_FILAS);
  const mini = l => `<div class="mini">${l.map(([t,v])=>`<div><p>${t}</p><b>${v}</b></div>`).join('')}</div>`;
  let kp = '', cab = [], der = [], cuerpo = '';

  if(TABLA==='Ventas'){
    const temprano = new Set(vista.filter(r=>{ const h = parseInt(r[0].slice(11,13),10); return isFinite(h) && h < UMBRAL.horaMin; }));
    const dobles = new Set(doblesCaptura(m.V).map(x=>x.id));
    kp = mini([['Venta', MXN(m.total)], ['Tickets', m.tickets.toLocaleString('es-MX')], ['Renglones', filas.length.toLocaleString('es-MX')]]);
    cab = ['Fecha','Producto','Modo','Cantidad','Total','Pago']; der = [3,4];
    cuerpo = vista.map(r=>[fechaCelda(r[0]) + (temprano.has(r) ? tag('¿hora?') : ''), esc(prodKey(r)) + (dobles.has(r[1]) ? tag('¿doble?') : ''), `<span style="color:var(--ink2)">${esc(r[4]||'–')}</span>`, cant(r[5]), MXN(r[7]), esc(r[8]||'–')]);
  } else if(TABLA==='Insumos'){
    const dup = new Set(dupInsumos(m.I).flatMap(g=>g.rows));
    kp = mini([['Total', MXN(m.carne + m.otros)], ['Carne', MXN(m.carne)], ['Otros', MXN(m.otros)]]);
    cab = ['Fecha','Producto','Cantidad','$/u','Costo','Proveedor']; der = [2,3,4];
    cuerpo = vista.map(r=>[fechaCelda(r[0]), `${esc(r[2])}${dup.has(r)?tag('¿dup?'):''}<span style="color:var(--muted)"> · ${esc(r[1])}</span>`, cant(r[3]) + (/kilo/i.test(r[4]) ? ' kg' : ''), num(r[5]) ? MXN(r[5]) : '–', num(r[6]) ? MXN(r[6]) : tag('sin costo'), esc(r[7]||'–')]);
  } else if(TABLA==='Gastos'){
    const dup = new Set(dupGastos(m.G).flatMap(g=>g.rows));
    kp = mini([['Total', MXN(m.gastos)], ['% de venta', m.total ? PCT(m.gastos/m.total,1) : '—'], ['Renglones', m.G.length]]);
    cab = ['Fecha','Categoría','Descripción','Monto','Proveedor']; der = [3];
    cuerpo = vista.map(r=>[fechaCelda(r[0]), esc(r[1]||'–'), esc(r[2]||'–') + (dup.has(r)?tag('¿dup?'):''), MXN(r[3]), esc(r[4]||'–')]);
  } else if(TABLA==='Sueldos'){
    kp = mini([['Total', MXN(m.sueldos)], ['Personas', new Set(m.S.map(r=>normTxt(r[1]))).size], ['Días pagados', cant(m.S.reduce((s,r)=>s+num(r[3]),0))]]);
    cab = ['Fecha','Nombre','Puesto','Días','Pagado']; der = [3,4];
    cuerpo = vista.map(r=>[fechaCelda(r[0]), esc(r[1]||'–'), esc(r[2]||'–'), cant(r[3]), MXN(r[4])]);
  } else {
    kp = mini([['Registros', m.P.length], ['Kilos', m.P.reduce((s,r)=>s+num(r[2]),0).toFixed(2)], ['Periodo anterior', ant.P.length]]);
    cab = ['Fecha','Categoría','Kilos','Piezas','Monto','Motivo']; der = [2,3,4];
    cuerpo = vista.map(r=>[fechaCelda(r[0]), esc(r[1]||'–'), cant(r[2]), cant(r[5]), num(r[4]) ? MXN(r[4]) : '–', esc(r[3]||'–')]);
  }
  const tabla = filas.length
    ? `<div class="tscroll"><table><tr>${cab.map((h,i)=>`<th class="${der.includes(i)?'r':''}">${h}</th>`).join('')}</tr>
       ${cuerpo.map(c=>`<tr>${c.map((v,i)=>`<td class="${der.includes(i)?'r':''}">${v}</td>`).join('')}</tr>`).join('')}</table></div>
       ${filas.length > LIM_FILAS ? `<p class="note">Mostrando los ${LIM_FILAS} más recientes de ${filas.length.toLocaleString('es-MX')}. Descarga el CSV para verlos todos.</p>` : ''}`
    : `<div class="vacio">Sin registros de ${TABLAS.find(([k])=>k===TABLA)[1].toLowerCase()} en este periodo</div>`;

  return `
  ${tarjetaAlertas('Datos', alertasDatos(m, R), R)}
  <div class="card" style="margin-bottom:12px"><h3>${TABLAS.find(([k])=>k===TABLA)[1]} del periodo <small>${esc(etiquetaRango(R))}${TABLA==='Ventas' && FILTRO ? ' · con filtro' : ''}</small></h3>
    <div class="seg" role="tablist" aria-label="Tabla a mostrar">${seg}</div>
    ${kp}${tabla}
    <button class="btn" style="margin-top:12px" onclick="descargarCSV('${TABLA}')">Descargar ${TABLAS.find(([k])=>k===TABLA)[1].toLowerCase()} del periodo (CSV)</button>
  </div>
  <div class="card"><h3>Calidad de los datos <small>todo el histórico</small></h3>
    <table>
      <tr><td>Rango de fechas</td><td class="r">${corto(fechas[0])} – ${corto(fechas[fechas.length-1])}</td></tr>
      ${Object.keys(ENC).map(k=>`<tr><td>Renglones en ${k}</td><td class="r">${RAW[k].length.toLocaleString('es-MX')}</td></tr>`).join('')}
      <tr><td>Semanas con ventas pero sin insumos</td><td class="r">${faltaI.length ? faltaI.map(s=>'vie '+corto(s)).join(', ') : '0'}</td></tr>
      <tr><td>Semanas con ventas pero sin sueldos</td><td class="r">${faltaN.length ? faltaN.map(s=>'vie '+corto(s)).join(', ') : '0'}</td></tr>
      <tr><td>Renglones de Surtido repartidos por corte <span style="color:var(--muted)">(se juntan con consolidarSurtido)</span></td><td class="r">${repartidos.toLocaleString('es-MX')}</td></tr>
      <tr><td>Ventas sin modo de captura <span style="color:var(--muted)">(versión anterior de la app)</span></td><td class="r">${sinModo}</td></tr>
      <tr><td>Ventas sin método de pago</td><td class="r">${sinPago}</td></tr>
      <tr><td>Ventas con total en cero</td><td class="r">${cero}</td></tr>
      ${SERVICIO ? `<tr><td>Servicio de Apps Script</td><td class="r">v${esc(SERVICIO.version||'?')} · ${esc(SERVICIO.tz||'zona sin dato')}</td></tr>` : ''}
    </table>
    <p class="note">Los renglones de "Regalo" no cuentan como venta.</p></div>`;
}

function descargarCSV(t){
  t = t || 'Ventas';
  const R = rango(); const rows = enRango(RAW[t], R.a, R.b);
  const csv = [ENC[t]].concat(rows).map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv'}));
  a.download = `${t.toLowerCase()}_${R.a}_${R.b}.csv`; a.click();
}

/* ================= Render ================= */
const TABS = [['resumen','Resumen'],['ventas','Ventas'],['costos','Costos'],['datos','Datos']];

function filtrar(campo, valor){
  if(valor==='Otros') return;
  FILTRO = (FILTRO && FILTRO.valor===valor) ? null : {campo, valor};
  render();
}

function render(){
  const main = document.getElementById('main');
  document.getElementById('tabs').classList.toggle('hid', !RAW);
  document.getElementById('ctl').classList.toggle('hid', !RAW);
  if(!RAW){ document.getElementById('subTxt').textContent=''; document.getElementById('filtroBox').innerHTML=''; pantallaFuente(); return; }
  if(!RAW.Ventas.length){ main.innerHTML = `<div class="empty"><h2>Tu hoja aún no tiene ventas</h2><p>En cuanto captures la primera venta en la app, aparecerá aquí.</p></div>`; return; }
  const p = document.getElementById('periodo').value;
  if(!CURSOR || (p==='mes') !== /^\d{4}-\d{2}$/.test(CURSOR)) CURSOR = p==='mes' ? addDays(ultimaSemana(),1).slice(0,7) : ultimaSemana();
  document.getElementById('tabs').innerHTML = TABS.map(([k,t])=>`<button class="${k===TAB?'on':''}" onclick="TAB='${k}';render()">${t}</button>`).join('');
  document.getElementById('navp').classList.toggle('hid', p==='todo' || p==='custom');
  document.getElementById('desde').classList.toggle('hid', p!=='custom');
  document.getElementById('hasta').classList.toggle('hid', p!=='custom');
  const R = rango();
  document.getElementById('rangoTxt').textContent = etiquetaRango(R);
  const m = metricas(R.a, R.b), ant = metricas(R.pa, R.pb);
  const diasV = m.dias.map(d=>`${DIAS[dow(d)].toLowerCase()} ${corto(d)}`);
  document.getElementById('srcTxt').textContent = FUENTE;
  document.getElementById('subTxt').textContent = `vie ${corto(R.a)} – jue ${corto(R.b)} · ${R.semanas} semana${R.semanas>1?'s':''} · ${diasV.length<=4 && diasV.length ? 'ventas ' + diasV.join(', ') : diasV.length + ' días con venta'} · costos de viernes a jueves`;
  document.getElementById('filtroBox').innerHTML = FILTRO ? `<span class="filtro">Filtrado por ${FILTRO.campo==='cat'?'categoría':'producto'}: <b>${esc(FILTRO.valor)}</b> <button onclick="FILTRO=null;render()" aria-label="Quitar filtro">✕</button></span>` : '';
  if(!m.V.length && TAB!=='datos' && TAB!=='costos'){ main.innerHTML = `<div class="empty"><h2>Sin ventas entre vie ${corto(R.a)} y jue ${corto(R.b)}</h2><p>Usa las flechas o elige otro periodo arriba.</p></div>`; return; }
  main.innerHTML = TAB==='resumen' ? vResumen(m, ant, R) : TAB==='ventas' ? vVentas(m, ant, R) : TAB==='costos' ? vCostos(m, ant, R) : vDatos(m, ant, R);
}

function mover(n){
  const p = document.getElementById('periodo').value;
  if(p==='mes'){ const [y,m] = CURSOR.split('-').map(Number); const d = new Date(y, m-1+n, 1); CURSOR = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
  else CURSOR = addDays(CURSOR, 7*n);
  render();
}

function pantallaFuente(msg){
  const c = cfgServicio() || {};
  document.getElementById('main').innerHTML = `
  <div class="empty">
    <h2>Conecta tus datos</h2>
    <p>Usa el mismo servicio de la app para ver todo en vivo, o carga el Excel descargado de tu hoja.</p>
    <div class="src">
      <label>URL del servicio (Apps Script)</label><input type="url" id="sUrl" value="${esc(c.scriptUrl||'')}" placeholder="https://script.google.com/macros/s/.../exec">
      <label>Clave de acceso</label><input type="password" id="sKey" value="${esc(c.key||'')}">
      <button class="btn pri" style="margin-top:12px;width:100%" onclick="conectar()">Conectar</button>
      <div class="drop" id="drop">O arrastra aquí tu archivo <b>Carnitas Ventas.xlsx</b>, o toca para elegirlo<input type="file" id="file" accept=".xlsx,.xls" class="hid"></div>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    </div>
  </div>`;
  const drop = document.getElementById('drop'), file = document.getElementById('file');
  drop.onclick = () => file.click();
  file.onchange = () => file.files[0] && usarExcel(file.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
  drop.ondragleave = () => drop.classList.remove('on');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); e.dataTransfer.files[0] && usarExcel(e.dataTransfer.files[0]); };
}

async function conectar(){
  const c = {scriptUrl: document.getElementById('sUrl').value.trim(), key: document.getElementById('sKey').value.trim()};
  if(!c.scriptUrl || !c.key) return pantallaFuente('Falta la URL o la clave');
  try{ localStorage.setItem('carnitas_dash_cfg', JSON.stringify(c)); }catch(e){}
  await desdeServicio(c);
}

async function desdeServicio(c){
  document.getElementById('main').innerHTML = `<div class="empty"><p>Cargando datos de tu hoja…</p></div>`;
  try{
    const d = await cargarServicio(c);
    SERVICIO = {version: d.version, tz: d.tz};
    RAW = normalizar(d.datos);
    const h = new Date(); FUENTE = `En vivo · servicio v${d.version || '?'} · ${pad(h.getHours())}:${pad(h.getMinutes())}`;
    CURSOR = null; render();
  }catch(e){ RAW = null; render(); pantallaFuente('No se pudo conectar: ' + e.message); }
}

async function usarExcel(f){
  document.getElementById('main').innerHTML = `<div class="empty"><p>Leyendo ${esc(f.name)}…</p></div>`;
  try{ SERVICIO = null; RAW = normalizar(await leerExcel(f)); FUENTE = `Archivo: ${f.name}`; CURSOR = null; render(); }
  catch(e){ RAW = null; render(); pantallaFuente('No se pudo leer el archivo: ' + e.message); }
}

/* ================= Tema claro / oscuro ================= */
function temaActual(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t) return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function pintarBotonTema(){
  const oscuro = temaActual()==='dark';
  document.getElementById('tema').textContent = oscuro ? '☀ Claro' : '☾ Oscuro';
  document.getElementById('tema').title = oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
}
document.getElementById('tema').onclick = () => {
  const nuevo = temaActual()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nuevo);
  try{ localStorage.setItem('carnitas_dash_tema', nuevo); }catch(e){}
  pintarBotonTema();
};
try{ const t = localStorage.getItem('carnitas_dash_tema'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); }catch(e){}
pintarBotonTema();

/* Tooltip compartido: cualquier elemento con data-tip */
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if(!t){ tip.style.opacity = 0; return; }
  tip.textContent = t.getAttribute('data-tip');
  tip.style.opacity = 1;
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = (e.clientY - 34) + 'px';
});

document.getElementById('periodo').onchange = () => { CURSOR = null; render(); };
document.getElementById('prev').onclick = () => mover(-1);
document.getElementById('next').onclick = () => mover(1);
document.getElementById('desde').onchange = render;
document.getElementById('hasta').onchange = render;
document.getElementById('refresh').onclick = () => { const c = cfgServicio(); c ? desdeServicio(c) : pantallaFuente(); };
document.getElementById('fuente').onclick = () => { RAW = null; FILTRO = null; render(); };

const inicial = cfgServicio();
if(inicial) desdeServicio(inicial); else render();
</script>
