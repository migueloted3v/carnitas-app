<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carnitas App</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#153243">
<style>
  :root{
    --bg:#153243; --card:#1D3F53; --card2:#415A77;
    --border:#2C4A61; --accent:#F85E00; --accent-light:#FF8A42; --accent-dark:#C94900;
    --text:#FFFFFF; --muted:#9FB6C4; --good:#7FD49B; --bad:#FF8A80;
    --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
    --st:env(safe-area-inset-top,0px); --sbm:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  button{font-family:inherit;cursor:pointer}
  header{background:var(--bg);color:var(--text);padding:calc(12px + var(--st)) calc(16px + var(--sr)) 12px calc(16px + var(--sl));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border)}
  header h1{font-size:clamp(15px,1.8vw,21px);margin:0;font-weight:500}
  header button{background:none;border:none;color:var(--muted);font-size:clamp(18px,2vw,24px)}
  #backbtn{font-size:clamp(20px,2.4vw,26px);padding:0 4px}
  #hspacer{flex:1}
  #app{max-width:1300px;margin:0 auto;padding:clamp(12px,2vw,26px) calc(clamp(12px,2vw,26px) + var(--sr)) clamp(12px,2vw,26px) calc(clamp(12px,2vw,26px) + var(--sl))}
  .navgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.6vw,20px);max-width:600px;margin:clamp(16px,3vw,40px) auto}
  .navcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(20px,3.4vw,40px) 16px;text-align:center;font-size:clamp(15px,1.8vw,20px);font-weight:500}
  .navcard.wide{grid-column:1/-1;padding:clamp(16px,2.6vw,28px) 16px}
  .navcard .ic{font-size:clamp(26px,3.4vw,42px);display:block;margin-bottom:10px}
  .navcard:active{border-color:var(--accent)}
  .ver{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}

  /* ---------- Captura ---------- */
  .row2{display:flex;gap:clamp(12px,1.6vw,20px);align-items:flex-start}
  .colmain{flex:1;min-width:0}
  .chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,0.8vw,10px);padding:2px 0 clamp(10px,1.4vw,16px)}
  .chip{min-width:0;border:1px solid var(--border);background:transparent;border-radius:20px;padding:clamp(8px,1vw,12px) 6px;font-size:clamp(11px,1.1vw,14px);color:var(--text);white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
  .chip.active{background:var(--accent);color:#FFFFFF;border-color:var(--accent);font-weight:500}
  .lostbtn{display:block;width:100%;background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:clamp(8px,1.2vw,14px);margin-bottom:clamp(10px,1.6vw,18px)}
  .prod{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:clamp(14px,2vw,22px) 6px;text-align:center;font-size:clamp(14px,1.6vw,18px);font-weight:500}
  .prod .sub{display:block;font-size:clamp(10px,1vw,13px);color:var(--muted);font-weight:400;margin-top:3px}
  .prod:active{border-color:var(--accent)}
  .prod.selected{border:1px solid var(--accent-light)}
  .panel{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:clamp(14px,2vw,22px);margin-bottom:clamp(10px,1.6vw,18px)}
  .panel h3{font-size:clamp(13px,1.4vw,16px);color:var(--text);margin:0 0 10px;font-weight:500}
  .nota{font-size:11px;color:var(--muted);margin:-4px 0 10px}
  .seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:9px 4px;font-size:13px}
  .seg button.on{background:var(--card);color:var(--text);border-color:var(--border);font-weight:500}
  .qtybtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
  .qtybtns button{padding:clamp(10px,1.4vw,14px) 4px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;font-size:clamp(12px,1.2vw,15px)}
  .qtybtns button small{display:block;color:var(--accent-light);font-size:12px;font-weight:500;margin-top:3px}
  .qtybtns button.sel small{color:#fff}
  .qtybtns button.sel{background:var(--accent);color:#FFFFFF;border-color:var(--accent);font-weight:500}
  input[type=number],input[type=date],input[type=text],input[type=url],input[type=password],select{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:var(--bg);color:var(--text);font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input::placeholder{color:#6F889A}
  .addbtn{width:100%;padding:clamp(11px,1.4vw,15px);background:var(--accent);color:#FFFFFF;border:none;border-radius:8px;font-size:clamp(14px,1.3vw,16px);font-weight:500;margin-top:10px}
  .addbtn.alt{background:var(--card);border:1px solid var(--border)}

  /* Ticket: columna lateral en horizontal / tablet */
  #ticket{flex:0 0 clamp(230px,26vw,360px);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:clamp(12px,1.8vw,20px);position:sticky;top:calc(76px + var(--st))}
  #ticket h3{font-size:clamp(13px,1.4vw,16px);color:var(--accent-light);margin:0 0 6px;font-weight:500}
  .tkbar{display:none}
  .items{max-height:40vh;overflow-y:auto;font-size:clamp(12px,1.2vw,15px);color:var(--muted);margin-bottom:4px}
  .tkline{display:flex;align-items:center;gap:6px;padding:3px 0}
  .tkline .lbl{flex:1;min-width:0}
  .tkline .x{flex:0 0 34px;height:34px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:8px;font-size:14px}
  .tkline .x:active{border-color:var(--bad);color:var(--bad)}
  .tktotal{display:flex;justify-content:space-between;font-weight:500;font-size:clamp(17px,1.8vw,21px);margin-bottom:10px;padding-top:8px;border-top:1px solid var(--border)}
  #cobrar{width:100%;padding:clamp(13px,1.8vw,18px);background:var(--accent);color:#FFFFFF;border:none;border-radius:8px;font-size:clamp(15px,1.5vw,18px);font-weight:500}

  /* Vertical: ticket como barra fija abajo, se despliega al tocarla */
  @media (max-width:760px){
    .row2{display:block}
    #view-ventas{padding-bottom:calc(84px + var(--sbm))}
    #ticket{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:8;border-radius:16px 16px 0 0;border-bottom:none;padding:10px calc(14px + var(--sr)) calc(10px + var(--sbm)) calc(14px + var(--sl))}
    #ticket h3,#ticket .tktotal,#cobrarSide,#cuentaSide{display:none}
    .chips{grid-template-columns:repeat(3,minmax(0,1fr))}
    #ticket .tkdetail{display:none;padding-bottom:6px}
    #ticket.open .tkdetail{display:block;margin-top:8px;border-top:1px solid var(--border);padding-top:6px}
    .items{max-height:38vh}
    .tkbar{display:flex;align-items:center;gap:12px}
    .tkbar .sum{flex:1;min-width:0;background:none;border:none;color:var(--text);text-align:left;padding:0}
    .tkbar .sum small{display:block;color:var(--muted);font-size:12px}
    .tkbar .sum b{font-size:19px;font-weight:500}
    .tkbar #cobrar{width:auto;padding:12px 26px}
    .tkbar .bank{border:1px solid var(--border);background:transparent;border-radius:8px;padding:10px 12px;font-size:17px;color:var(--text)}
  }

  /* ---------- Formularios ---------- */
  .formcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;max-width:420px}
  .formcard label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
  .listcard{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:16px;max-width:420px}
  .listcard h3{font-size:13px;color:var(--accent-light);margin:0 0 8px;font-weight:500}
  .rowline{display:flex;justify-content:space-between;gap:8px;font-size:clamp(13px,1.3vw,15px);padding:6px 0}
  @media (min-width:761px){ .formwrap{display:flex;gap:16px;align-items:flex-start} .formwrap .listcard{margin-top:0;flex:1} }

  /* ---------- Hojas modales ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
  .sheet{background:var(--card2);width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px calc(18px + var(--sr)) calc(18px + var(--sbm)) calc(18px + var(--sl));max-height:88vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none}
  .sheet.wide{max-width:760px}
  .sheet h2{font-size:16px;margin:0 0 12px;font-weight:500}
  .sheetcols{display:block}
  @media (min-width:640px) and (orientation:landscape){ .sheetcols{display:flex;gap:18px} .sheetcols>div{flex:1;min-width:0} }
  .payopt{display:block;width:100%;padding:13px;margin-bottom:8px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:15px;text-align:left}
  .payopt:active{border-color:var(--accent)}
  label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
  .catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .hint{font-size:11px;color:var(--muted);margin:5px 0 0}
  .status{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:10px;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 9px}
  .dot.ok{background:var(--good)} .dot.bad{background:var(--bad)}

  /* ---------- Cobro y cuenta ---------- */
  .paysel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .paysel button{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;padding:12px 4px;font-size:14px}
  .paysel button.on{background:var(--accent);border-color:var(--accent);font-weight:500}
  .bills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}
  .bills button{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;padding:12px 2px;font-size:14px}
  .bills button.on{border-color:var(--accent-light);background:var(--card)}
  .cambio{background:var(--bg);border:1px solid var(--good);border-radius:10px;padding:10px;text-align:center;margin-top:10px}
  .cambio.falta{border-color:var(--bad)}
  .cambio small{display:block;color:var(--muted);font-size:12px}
  .cambio b{font-size:28px;font-weight:500;color:var(--good)}
  .cambio.falta b{color:var(--bad)}
  .cta{display:grid;gap:14px;align-items:center}
  .cta .qr{justify-self:center;text-align:center}
  .cta .qr svg{background:#fff;border-radius:10px;padding:6px;width:190px;height:190px;display:block}
  .cta .qr p{font-size:11px;color:var(--muted);margin:6px 0 0}
  .dato{margin-bottom:10px}
  .dato small{display:block;font-size:11px;color:var(--muted)}
  .dato b{font-size:16px;font-weight:500;overflow-wrap:break-word}
  .dato.big b{font-size:22px;letter-spacing:.5px;white-space:nowrap}
  @media (min-width:640px) and (orientation:landscape){
    .cta{grid-template-columns:minmax(0,1fr) auto} .cta .qr{order:2} .cta .qr svg{width:170px;height:170px}
    #cobroDetalle .cta .qr svg{width:136px;height:136px}
    #cobroDetalle .dato.big b{font-size:18px;letter-spacing:0}
    #cobroDetalle .dato b{font-size:15px}
  }

  /* ---------- Avisos ---------- */
  .badge{position:fixed;top:calc(62px + var(--st));right:calc(12px + var(--sr));background:var(--accent-dark);color:#FFFFFF;font-size:12px;padding:6px 11px;border-radius:12px;z-index:6;border:none}
  #toast{position:fixed;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);background:#0E2432;border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
  #toast.err{border-color:var(--bad)}
  .hidden{display:none !important}
  @media (max-height:520px) and (orientation:landscape){
    header{padding-top:calc(8px + var(--st));padding-bottom:8px}
    #hsub{display:none}
    .prod{padding:10px 4px;font-size:14px}
    .prod .sub{display:none}
    .chip{padding:7px 4px}
    .lostbtn{padding:8px;margin-bottom:10px}
    #ticket{top:calc(56px + var(--st))}
    .items{max-height:34vh}
  }
  .hsvg{max-height:170px}

  /* ---------- Venta del día ---------- */
  .dbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .dbar .nav{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;width:40px;height:38px;font-size:18px}
  .dbar .fecha{font-size:16px;font-weight:500;flex:1;min-width:150px;text-align:center}
  .dchips{display:flex;gap:6px}
  .dchip{position:relative;border:1px solid var(--border);border-radius:16px;padding:7px 13px;font-size:13px;color:var(--muted);background:none;overflow:hidden}
  .dchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:none}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
  .kpi.main{border-top:3px solid var(--accent)}
  .kpi p{margin:0}
  .kpi .l{font-size:11px;color:var(--muted)}
  .kpi .v{font-size:clamp(19px,2.4vw,26px);font-weight:500;margin-top:3px}
  .kpi .d{font-size:11px;margin-top:2px;color:var(--muted)}
  .kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--bad)}
  .dgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
  .dcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}
  .dcard h4{font-size:12px;color:var(--muted);font-weight:400;margin:0 0 10px}
  .brow{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:7px}
  .brow .n{width:74px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .b{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
  .brow .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .brow .val{width:62px;text-align:right}
  .paybar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:8px;background:var(--bg)}
  .msg{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
  @media (max-width:760px){
    .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
    .kpis .kpi.main{grid-column:1/-1;text-align:center}
    .dgrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <button id="backbtn" class="hidden" onclick="irInicio()" aria-label="Regresar">‹</button>
  <div>
    <h1 id="hstate">Carnitas App</h1>
    <p id="hsub" style="font-size:12px;color:var(--muted);margin:2px 0 0">Sábado y domingo</p>
  </div>
  <div id="hspacer"></div>
  <button onclick="openSettings()" aria-label="Ajustes">⚙</button>
</header>

<button id="pendbadge" class="badge hidden" onclick="enviarAhora()"></button>
<div id="toast"></div>

<div id="app">

  <div id="view-inicio">
    <div class="navgrid">
      <div class="navcard" onclick="irVista('ventas')"><span class="ic">🥩</span>Ventas</div>
      <div class="navcard" onclick="irVista('insumos')"><span class="ic">🛒</span>Insumos</div>
      <div class="navcard" onclick="irVista('gastos')"><span class="ic">🧾</span>Gastos</div>
      <div class="navcard" onclick="irVista('sueldos')"><span class="ic">👷</span>Sueldos</div>
      <div class="navcard wide" onclick="irVista('dia')"><span class="ic">📊</span>Venta del día</div>
    </div>
    <p class="ver" id="verInicio"></p>
  </div>

  <div id="view-ventas" class="hidden">
    <div class="row2">
      <div class="colmain">
        <div class="chips" id="chips"></div>
        <button class="lostbtn" onclick="abrirVentaPerdida()">📉 ¿Se te fue un cliente? Registrar venta perdida</button>
        <div class="grid" id="grid"></div>
        <div id="qtypanel"></div>
      </div>
      <div id="ticket">
        <div class="tkbar">
          <button class="sum" onclick="toggleTicket()"><small id="tkcount">Ticket · sin productos</small><b id="tktotalBar">$0</b> <span id="tkarrow" style="color:var(--muted);font-size:12px">▲</span></button>
          <button class="bank" onclick="abrirCuenta()" aria-label="Datos para transferencia">🏦</button>
          <button id="cobrar" onclick="abrirCobro()">Cobrar</button>
        </div>
        <div class="tkdetail">
          <h3>Ticket actual</h3>
          <div class="items" id="ticketitems">Sin productos aún</div>
        </div>
        <div class="tktotal"><span>Total</span><span id="ticketTotal">$0</span></div>
        <button id="cobrarSide" class="addbtn" style="margin-top:0;padding:clamp(13px,1.8vw,18px);font-size:clamp(15px,1.5vw,18px)" onclick="abrirCobro()">Cobrar</button>
        <button id="cuentaSide" class="addbtn alt" onclick="abrirCuenta()">🏦 Datos para transferencia</button>
      </div>
    </div>
  </div>

  <div id="view-insumos" class="hidden">
    <div class="formwrap">
    <div class="formcard">
      <label>Fecha</label>
      <input type="date" id="ins_fecha">
      <label>Categoría</label>
      <select id="ins_categoria" onchange="toggleInsumoCategoria()">
        <option>Carne</option><option>Verdura/Salsa</option><option>Bebidas</option><option>Cerveza</option>
        <option>Desechables</option><option>Oxxo</option><option>Masa</option><option>Tortillas</option>
        <option>Gas</option><option>Luz</option><option>Renta</option><option>Agua</option>
        <option>Internet</option><option>Super</option><option>Otros</option>
      </select>

      <div id="ins_carne_fields">
        <label>Producto</label>
        <select id="ins_producto">
          <option>Pierna</option><option>Buche</option><option>Nuca</option><option>Costilla</option>
          <option>Aldilla</option><option>Pellet</option><option>Crakelyn</option><option>Cuero</option>
          <option>Manteca</option><option>Cachete</option><option>Cuero con lonja</option><option>Codillo</option>
          <option>Otro</option>
        </select>
        <label>Cantidad (kg)</label>
        <input type="number" id="ins_cantidad" placeholder="Ej. 25.5" inputmode="decimal" step="any">
        <label>Precio por kilo</label>
        <input type="number" id="ins_precio" placeholder="Ej. 85" inputmode="decimal" step="any">
      </div>

      <div id="ins_otro_fields" class="hidden">
        <label>Descripción</label>
        <input type="text" id="ins_desc" placeholder="Ej. Cilantro, cebolla y limón">
        <label>Monto</label>
        <input type="number" id="ins_monto" placeholder="Ej. 250" inputmode="decimal" step="any">
      </div>

      <label>Proveedor / lugar</label>
      <input type="text" id="ins_proveedor" placeholder="Ej. Guadalupano">
      <button class="addbtn" onclick="guardarInsumo()">Guardar insumo</button>
    </div>
    <div class="listcard"><h3>Capturados hoy</h3><div id="ins_lista">Sin registros aún</div></div>
    </div>
  </div>

  <div id="view-gastos" class="hidden">
    <div class="formwrap">
    <div class="formcard">
      <label>Fecha</label>
      <input type="date" id="ga_fecha">
      <label>Categoría</label>
      <select id="ga_categoria">
        <option>Oxxo</option><option>Comida</option><option>Postres</option><option>Otros</option>
      </select>
      <label>Descripción</label>
      <input type="text" id="ga_desc" placeholder="Ej. Cervezas, tanque de gas...">
      <label>Monto</label>

<script>
const APP_VERSION = '2.1.0';

/* =========================================================
   Catálogo
   tipo: "kilo" → Kilos · Gramos · Monto
         "gramos" → Gramos · Monto
         "pieza" → cantidad de piezas
         "pollo" → entero o medio (Medio · 1 · 1½ · 2 u otra cantidad)
   ========================================================= */
const CATS = {
  "Carne": {tipo:"kilo", productos:["Surtido","Maciza","Pierna","Chamorro","Buche","Aldilla","Nuca","Costilla","Cuerito"]},
  "Pollo": {tipo:"pollo", productos:["Pollo"]},
  "Gorditas": {tipo:"pieza", productos:["Gorda normal","Gorda rellena"]},
  "Tacos": {tipo:"pieza", productos:["Taco"]},
  "Frijoles charros": {tipo:"pieza", productos:["Litro","Medio","Vaso"]},
  "Chicharrón": {tipo:"gramos", productos:["Durito botanero","Chicharron de cachete","Chicharrón de lonja","Chicharron crakelyn"]},
  "Bebida": {tipo:"pieza", productos:["Refresco","Agua de sabor"]},
  "Tortillas": {tipo:"kilo", productos:["Tortilla"]},
  "Torta": {tipo:"pieza", productos:["Torta"]}
};

// Nombre corto para los botones de categoría (el dato se guarda con el nombre completo)
const ETIQUETA_CAT = {"Frijoles charros":"Frijoles"};
function etqCat(c){ return ETIQUETA_CAT[c] || c; }

// Precios de respaldo: [kilo o pieza, medio, cuarto]. Los reales vienen de la pestaña Precios.
// Si medio o cuarto no están, se calculan proporcionales al precio del kilo.
const PRECIOS_DEFAULT = {
  "Surtido":[370,185,95],"Maciza":[370,185,95],"Pierna":[370,185,95],"Chamorro":[370,185,95],"Buche":[370,185,95],"Nuca":[370,185,95],
  "Aldilla":[400,200,100],"Costilla":[400,200,100],"Cuerito":[200],
  "Pollo":[200,100],
  "Durito botanero":[300],"Chicharron de cachete":[300],"Chicharrón de lonja":[250],"Chicharron crakelyn":[300],
  "Tortilla":[30],
  "Refresco":[30],"Agua de sabor":[50],
  "Gorda normal":[20],"Gorda rellena":[35],
  "Taco":[17],
  "Litro":[70],"Medio":[35],"Vaso":[20],
  "Torta":[55]
};

// Cortes que se promedian para armar "Surtido", en base a lo comprado en Insumos
const CORTES_SURTIDO = ["Pierna","Buche","Nuca","Aldilla","Costilla"];
const VENTANA_SURTIDO_DIAS = 56; // 8 semanas

const ENC = {
  Ventas:['Fecha','Ticket','Categoría','Producto','Modo','Cantidad','Precio unitario','Total','Método de pago'],
  Insumos:['Fecha','Categoría','Producto','Cantidad','Tipo','Precio unitario','Costo total','Proveedor'],
  Gastos:['Fecha','Categoría','Descripción','Monto','Proveedor'],
  Sueldos:['Fecha','Nombre','Puesto','Días trabajados','Monto pagado'],
  VentasPerdidas:['Fecha','Categoría','Kilos estimados','Motivo','Monto estimado','Piezas estimadas']
};

const TITULOS = {
  inicio:['Carnitas App','Sábado y domingo'],
  ventas:['Nueva venta','Toca un producto para agregarlo'],
  insumos:['Insumos','Compras de carne y materia prima'],
  gastos:['Gastos','Otros gastos del negocio'],
  sueldos:['Sueldos','Pagos a ayudantes'],
  dia:['Venta del día','Datos en vivo de tu hoja']
};

const TIMEOUT_MS = 15000;

/* ---------- Estado ---------- */
function leerJSON(k, def){ try{ const v = JSON.parse(localStorage.getItem(k)); return v==null ? def : v; }catch(e){ return def; } }
function guardarJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let cfg = leerJSON('carnitas_cfg', {});
function normPrecio(v){
  const n = x => (x===''||x==null||!isFinite(x)) ? null : Number(x);
  if(Array.isArray(v)) return {k:n(v[0])||0, m:n(v[1]), c:n(v[2])};
  if(v && typeof v==='object' && 'k' in v) return {k:Number(v.k)||0, m:n(v.m), c:n(v.c)};
  return null;
}

/* ---------- Utilidades ---------- */
function fmt(n){ return '$' + Math.round(n||0).toLocaleString('es-MX'); }
function pad(n){ return String(n).padStart(2,'0'); }
function fechaLocal(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function hoy(){ return fechaLocal(new Date()); }
function sumarDias(iso, n){ const [y,m,d] = iso.split('-').map(Number); return fechaLocal(new Date(y, m-1, d+n)); }
function fechaHoraSheets(){ const d = new Date(); return `${fechaLocal(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function nuevoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

let toastTimer = null;
function toast(msg, esError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!esError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), esError ? 3500 : 2200);
}

/* =========================================================
   Conexión con el servicio (Google Apps Script)
   ========================================================= */
function servicioListo(){ return !!(cfg.scriptUrl && cfg.key); }

async function fetchT(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms || TIMEOUT_MS);
  try{ return await fetch(url, Object.assign({}, opts, {signal: ctrl.signal, redirect:'follow'})); }
  catch(e){
    if(e.name === 'AbortError') throw new Error('el servicio tardó demasiado en responder');
    throw new Error('sin señal o sin conexión al servicio');
  }
  finally{ clearTimeout(t); }
}

async function jsonDe(res){
  // Si la URL no es la del servicio, Google devuelve una página HTML en vez de datos
  try{ return await res.json(); }
  catch(e){ throw new Error('la URL no responde como el servicio; revisa que termine en /exec y que el acceso sea "Cualquier persona"'); }
}

async function apiGet(action, params, ms){
  if(!servicioListo()) throw new Error('Configura el servicio en Ajustes');
  const q = new URLSearchParams(Object.assign({action, key: cfg.key}, params||{}));
  const res = await fetchT(cfg.scriptUrl + (cfg.scriptUrl.includes('?') ? '&' : '?') + q.toString(), {method:'GET'}, ms);
  if(!res.ok) throw new Error('El servicio respondió ' + res.status);
  const data = await jsonDe(res);
  if(!data.ok) throw new Error(data.error || 'Error del servicio');
  return data;
}

async function apiPost(payload){
  if(!servicioListo()) throw new Error('Configura el servicio en Ajustes');
  // Sin encabezado Content-Type: se envía como text/plain y Google no pide permiso previo (CORS)
  const res = await fetchT(cfg.scriptUrl, {method:'POST', body: JSON.stringify(Object.assign({key: cfg.key}, payload))});
  if(!res.ok) throw new Error('El servicio respondió ' + res.status);
  const data = await jsonDe(res);
  if(!data.ok) throw new Error(data.error || 'Error del servicio');
  return data;
}

/* =========================================================
   Cola de envío: todo se guarda primero en el cel y luego se
   manda a la hoja. Si no hay señal, se reintenta solo.
   ========================================================= */
function encolar(sheet, rows){
  if(!rows || !rows.length) return;
  outbox.push({id: nuevoId(), sheet, rows, creado: Date.now()});
  guardarJSON('carnitas_outbox', outbox);
  updateBadge();
  enviarPendientes();
}

async function enviarPendientes(){
  if(sincronizando || !outbox.length || !servicioListo()) { updateBadge(); return; }
  if(navigator.onLine === false){ updateBadge(); return; }
  sincronizando = true;
  try{
    // Recorre la cola en orden; se detiene en el primer error de red (no hay ciclo infinito:
    // cada vuelta o saca un envío o termina).
    while(outbox.length){
      const item = outbox[0];
      try{
        await apiPost({action:'append', id: item.id, sheet: item.sheet, rows: item.rows});
        outbox.shift();
        guardarJSON('carnitas_outbox', outbox);
      }catch(e){
        const msg = String(e.message||'');
        if(/Pestaña no permitida/.test(msg)){
          // Error permanente: se aparta para no bloquear lo demás
          const fallidos = leerJSON('carnitas_fallidos', []);
          fallidos.push(Object.assign({error: msg}, item));
          guardarJSON('carnitas_fallidos', fallidos);
          outbox.shift();
          guardarJSON('carnitas_outbox', outbox);
          continue;
        }
        if(/Clave incorrecta|Falta crear la clave/.test(msg)) toast('Revisa la clave en Ajustes: ' + msg, true);
        break;
      }
    }
  } finally {
    sincronizando = false;
    updateBadge();
  }
}

function filasPendientes(){ return outbox.reduce((s,i)=>s+i.rows.length, 0); }

function updateBadge(){
  const b = document.getElementById('pendbadge');
  const n = filasPendientes();
  if(n>0){ b.textContent = `${n} por enviar ↻`; b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}

async function enviarAhora(){
  if(!servicioListo()){ toast('Configura el servicio en Ajustes', true); return; }
  toast('Enviando…');
  await enviarPendientes();
  toast(outbox.length ? 'Sin señal por ahora, se reintentará solo' : 'Todo enviado', !!outbox.length);
}

// Precio por kilo (o por pieza)
function precioDe(p){ const v = precios[p]; return v && v.k ? v.k : 0; }

// Precio de una cantidad en kilos/pollos: kilos completos + la fracción que sobra.
// 3/4 = medio + cuarto · 1¼ = kilo + cuarto · 1½ = kilo + medio
function precioFraccion(p, q){
  const v = precios[p]; if(!v || !v.k) return 0;
  const medio = v.m!=null ? v.m : v.k/2, cuarto = v.c!=null ? v.c : v.k/4;
  const ent = Math.floor(q + 1e-9), r = Math.round((q - ent)*100)/100;
  const resto = r===0 ? 0 : r===0.25 ? cuarto : r===0.5 ? medio : r===0.75 ? medio + cuarto : r*v.k;
  return ent*v.k + resto;
}

// Qué % de "Surtido" corresponde a cada corte, según lo comprado en Insumos
// (categoría Carne) en las últimas 8 semanas. Se cachea por día.
// Si no hay señal o datos, usa el último cálculo guardado o reparte en partes iguales.
async function calcularDistribucionSurtido(forzar){
  const cache = leerJSON('carnitas_surtido_dist', null);
  if(!forzar && cache && cache.calculadoEn === hoy() && cache.distribucion){
    distribucionSurtidoActual = cache.distribucion;
    return cache.distribucion;
  }
  const fallbackIgual = Object.fromEntries(CORTES_SURTIDO.map(c=>[c, 1/CORTES_SURTIDO.length]));
  if(!servicioListo()){
    distribucionSurtidoActual = (cache && cache.distribucion) || fallbackIgual;
    return distribucionSurtidoActual;
  }
  try{
    const data = await apiGet('insumos', null, 6000);
    const limiteStr = sumarDias(hoy(), -VENTANA_SURTIDO_DIAS);
    const sumas = Object.fromEntries(CORTES_SURTIDO.map(c=>[c,0]));
    (data.filas || []).forEach(row=>{
      const [fecha, categoria, producto, cantidad] = row;
      if(categoria==='Carne' && CORTES_SURTIDO.includes(producto) && String(fecha).slice(0,10) >= limiteStr){
        sumas[producto] += num(cantidad);
      }
    });
    const total = Object.values(sumas).reduce((a,b)=>a+b,0);
    const distribucion = total>0 ? Object.fromEntries(CORTES_SURTIDO.map(c=>[c, sumas[c]/total])) : fallbackIgual;
    guardarJSON('carnitas_surtido_dist', {calculadoEn: hoy(), distribucion});
    distribucionSurtidoActual = distribucion;
  }catch(e){
    distribucionSurtidoActual = (cache && cache.distribucion) || fallbackIgual;
  }
  return distribucionSurtidoActual;
}

function textoDistribucionSurtido(dist){
  if(!dist) return '';
  return CORTES_SURTIDO.map(c=>`${c} ${Math.round((dist[c]||0)*100)}%`).join(' · ');
}

    panel.innerHTML = `
      <div class="panel">

          `<button onclick="agregarPollo('${p}',${q})">${t}<small>${fmt(precioFraccion(producto,q))}</small></button>`).join('')}</div>

        <button class="addbtn" onclick="agregarPollo('${p}')">Agregar</button>

  }

  if(tipo==='pieza'){
    panel.innerHTML = `
      <div class="panel">
        <h3>${esc(producto)} · cantidad</h3>
        <input type="number" id="qInput" placeholder="Ej. 3" min="1" inputmode="numeric" onkeydown="if(event.key==='Enter')agregarPieza('${p}')">
        <button class="addbtn" onclick="agregarPieza('${p}')">Agregar</button>
      </div>`;
    enfocar('qInput');
    mostrarPanel();
    return;
  }

  const modos = tipo==='kilo' ? ['Kilos','Gramos','Monto'] : ['Gramos','Monto'];
  if(!modos.includes(modoCaptura)) modoCaptura = modos[0];
  let cuerpo = '';
  if(modoCaptura==='Kilos'){
    cuerpo = `<div class="qtybtns">${[[0.25,'1/4 kg'],[0.5,'1/2 kg'],[0.75,'3/4 kg'],[1,'1 kg'],[1.25,'1¼ kg'],[1.5,'1½ kg'],[2,'2 kg']].map(([k,t])=>
      `<button onclick="agregarKilo('${p}',${k})">${t}<small>${fmt(precioFraccion(producto,k))}</small></button>`).join('')}</div>`;
  } else if(modoCaptura==='Gramos'){
    cuerpo = `<input type="number" id="gInput" placeholder="Ej. 350" inputmode="numeric" onkeydown="if(event.key==='Enter')agregarGramos('${p}')">
              <button class="addbtn" onclick="agregarGramos('${p}')">Agregar</button>`;
  } else {
    cuerpo = `<input type="number" id="mInput" placeholder="Ej. 200" inputmode="decimal" step="any" onkeydown="if(event.key==='Enter')agregarMonto('${p}')">
              <button class="addbtn" onclick="agregarMonto('${p}')">Agregar</button>`;
  }
  panel.innerHTML = `
    <div class="panel">
      <h3>${esc(producto)} · ${fmt(precioDe(producto))} el kilo</h3>
      ${nota}
      <div class="seg">${modos.map(m=>`<button class="${m===modoCaptura?'on':''}" onclick="modoCaptura='${m}';abrirCantidad('${p}')">${m}</button>`).join('')}</div>
      ${cuerpo}
    </div>`;
  if(modoCaptura==='Gramos') enfocar('gInput');
  if(modoCaptura==='Monto') enfocar('mInput');
  mostrarPanel();
}

// Asegura que el panel de cantidad quede a la vista (sobre todo en horizontal)
function mostrarPanel(){
  const el = document.querySelector('#qtypanel .panel');
  if(el && el.scrollIntoView) setTimeout(()=>el.scrollIntoView({block:'nearest', behavior:'smooth'}), 30);
}

function cerrarPanel(){
  document.getElementById('qtypanel').innerHTML='';
  document.querySelectorAll('.prod').forEach(el=>el.classList.remove('selected'));
}

function validarPrecio(producto){
  const precio = precioDe(producto);
  if(!precio){ toast('Este producto no tiene precio. Ve a Ajustes → Sincronizar precios.', true); return 0; }
  return precio;
}

function agregarKilo(producto, frac){
  const precio = validarPrecio(producto); if(!precio) return;
  const dist = producto==='Surtido' ? distribucionSurtidoActual : null;
  ticket.push({categoria:catActiva, producto, modo:'Fracción', cantidad:frac, precioUnit:precio, total:precioFraccion(producto, frac), distribucion:dist});
  cerrarPanel(); renderTicket();
}
function agregarGramos(producto){
  const g = num(val('gInput'));
  if(g<=0){ toast('Captura los gramos', true); return; }
  const precio = validarPrecio(producto); if(!precio) return;
  const dist = producto==='Surtido' ? distribucionSurtidoActual : null;
  ticket.push({categoria:catActiva, producto, modo:'Gramos', cantidad:Math.round(g), precioUnit:precio, total:precio*g/1000, distribucion:dist});
  cerrarPanel(); renderTicket();
}
function agregarMonto(producto){
  const m = num(val('mInput'));
  if(m<=0){ toast('Captura el monto', true); return; }
  const precio = validarPrecio(producto); if(!precio) return;
  const kg = m/precio;
  const dist = producto==='Surtido' ? distribucionSurtidoActual : null;
  ticket.push({categoria:catActiva, producto, modo:'Monto', cantidad:m, kgEquivalente: Math.round(kg*1000)/1000, precioUnit:precio, total:m, distribucion:dist});
  cerrarPanel(); renderTicket();
}
function agregarPollo(producto, q){
  if(q === undefined){
    q = num(val('qInput'));
    if(!(q>0)){ toast('Captura cuántos pollos', true); return; }
    q = Math.round(q*2)/2; // se vende por medios
    if(!(q>0)){ toast('La cantidad mínima es medio pollo', true); return; }
  }
  const precio = validarPrecio(producto); if(!precio) return;
  ticket.push({categoria:catActiva, producto, modo:'Piezas', cantidad:q, precioUnit:precio, total:precioFraccion(producto, q)});
  cerrarPanel(); renderTicket();
}

function agregarPieza(producto){
  const q = parseInt(val('qInput'),10);
  if(!(q>0)){ toast('Captura la cantidad', true); return; }
  const precio = validarPrecio(producto); if(!precio) return;
  ticket.push({categoria:catActiva, producto, modo:'Piezas', cantidad:q, precioUnit:precio, total:precio*q});
  cerrarPanel(); renderTicket();
}

function textoMedios(q){ const e = Math.floor(q), m = q - e > 0.01; return e===0 ? '½' : `${e}${m?'½':''}`; }

function etiquetaItem(it){
  if(CATS[it.categoria] && CATS[it.categoria].tipo==='pollo') return `${textoMedios(it.cantidad)} ${it.producto}`;
  if(it.modo==='Monto') return `${fmt(it.cantidad)} de ${it.producto} (~${it.kgEquivalente}kg)`;
  return `${it.cantidad}${it.modo==='Fracción'?' kg':it.modo==='Gramos'?' g':'x'} ${it.producto}`;
}

function renderTicket(){
  const items = document.getElementById('ticketitems');
  if(ticket.length===0){ items.innerHTML = 'Sin productos aún'; }
  else {
    items.innerHTML = ticket.map((it,i)=>`
      <div class="tkline"><span class="lbl">${esc(etiquetaItem(it))}</span><span>${fmt(it.total)}</span>
      <button class="x" onclick="quitar(${i})" aria-label="Quitar">✕</button></div>`).join('');
  }
  const total = ticket.reduce((s,i)=>s+i.total,0);
  document.getElementById('ticketTotal').textContent = fmt(total);
  document.getElementById('tktotalBar').textContent = fmt(total);
  document.getElementById('tkcount').textContent = ticket.length ? `Ticket · ${ticket.length} producto${ticket.length>1?'s':''} · ver detalle` : 'Ticket · sin productos';
  if(!ticket.length) document.getElementById('ticket').classList.remove('open');
  document.getElementById('tkarrow').textContent = document.getElementById('ticket').classList.contains('open') ? '▼' : '▲';
}
function toggleTicket(){

  document.getElementById('ticket').classList.toggle('open');

}
function quitar(i){ ticket.splice(i,1); renderTicket(); }

function totalTicket(){ return ticket.reduce((s,i)=>s+i.total,0); }

// Billetes probables (solo mayores al total): siguiente múltiplo de $50, billetes de $200, $500 y $1,000,
// y para cuentas grandes el siguiente múltiplo de $500 y de $1,000. Se muestran los 3 más cercanos.
function billetes(total){
  const c = [Math.ceil(total/50)*50, 200, 500, 1000, Math.ceil(total/500)*500, Math.ceil(total/1000)*1000].filter(v=>v>total);
  return [...new Set(c)].sort((a,b)=>a-b).slice(0,3);
}

function elegirMetodo(m){
  // Tarjeta no necesita pasos extra: se registra al tocarla
  if(m==='Tarjeta'){ finalizarVenta('Tarjeta'); return; }
  cobro.metodo = m; cobro.paga = 'exacto';
  ['Efectivo','Tarjeta','Transferencia'].forEach(x=>{ const b = document.getElementById('pm_'+x); if(b) b.classList.toggle('on', x===m); });
  const total = Math.round(totalTicket());
  const det = document.getElementById('cobroDetalle');
  if(m==='Efectivo'){
    det.innerHTML = `
      <label>¿Con cuánto paga?</label>
      <div class="bills" id="bills">
        <button class="on" data-v="exacto" onclick="elegirPago('exacto')">Exacto</button>
        ${billetes(total).map(v=>`<button data-v="${v}" onclick="elegirPago(${v})">${fmt(v)}</button>`).join('')}
      </div>
      <input type="number" id="pagaInput" placeholder="Otro monto · Ej. 400" inputmode="numeric" oninput="elegirPago(this.value===''?'exacto':Number(this.value), true)">
      <div class="cambio" id="cambioBox"><small>Cambio</small><b>$0</b></div>
      <button class="addbtn" onclick="registrarEfectivo()">Registrar venta</button>`;
    actualizarCambio();
  } else {
    det.innerHTML = `
      <div style="margin-top:10px">${datosCuentaHTML()}</div>
      <button class="addbtn" onclick="finalizarVenta('Transferencia')">Transferencia recibida · Registrar</button>`;
  }
}

function elegirPago(v, desdeInput){
  cobro.paga = v;
  if(!desdeInput){ const i = document.getElementById('pagaInput'); if(i) i.value = ''; }
  document.querySelectorAll('#bills button').forEach(b=>b.classList.toggle('on', !desdeInput && String(b.dataset.v)===String(v)));
  actualizarCambio();
}

function actualizarCambio(){
  const total = Math.round(totalTicket());
  const paga = cobro.paga==='exacto' ? total : num(cobro.paga);
  const box = document.getElementById('cambioBox'); if(!box) return;
  const dif = paga - total;
  box.classList.toggle('falta', dif<0);
  box.innerHTML = dif<0 ? `<small>Faltan</small><b>${fmt(-dif)}</b>` : `<small>Cambio</small><b>${fmt(dif)}</b>`;
}

function registrarEfectivo(){
  const total = Math.round(totalTicket());
  const paga = cobro.paga==='exacto' ? total : num(cobro.paga);
  if(paga < total){ toast(`El pago no cubre el total: faltan ${fmt(total-paga)}`, true); return; }
  finalizarVenta('Efectivo');
  if(paga > total) toast(`Venta registrada · cambio ${fmt(paga-total)}`);
}

function cerrarModal(){ document.getElementById('modalRoot').innerHTML=''; }

function finalizarVenta(metodo){
  if(!ticket.length){ cerrarModal(); return; }
  const regalados = Math.max(0, parseInt(val('regaloInput'),10) || 0);
  // Se toma una copia y se vacía el ticket de inmediato: evita cobros dobles
  const items = ticket; ticket = [];
  cerrarModal(); renderTicket();

  const ticketId = 'T' + Date.now();
  const fecha = fechaHoraSheets();
  const rows = [];
  items.forEach(it=>{
    if(it.producto === 'Surtido' && it.distribucion){
      const kgTotal = it.modo==='Monto' ? it.kgEquivalente : (it.modo==='Gramos' ? it.cantidad/1000 : it.cantidad);
      const cortes = CORTES_SURTIDO.filter(c => (it.distribucion[c]||0) > 0);
      const totalRedondo = Math.round(it.total);
      let asignado = 0;
      cortes.forEach((corte, idx)=>{
        const pct = it.distribucion[corte];
        const kgCorte = Math.round(kgTotal*pct*1000)/1000;
        // El último corte absorbe el redondeo para que la suma cuadre con lo cobrado
        const totalCorte = idx === cortes.length-1 ? totalRedondo - asignado : Math.round(it.total*pct);
        asignado += totalCorte;
        rows.push([fecha, ticketId, it.categoria, corte, 'Surtido', kgCorte, Math.round(it.precioUnit), totalCorte, metodo]);
      });
    } else {
      rows.push([fecha, ticketId, it.categoria, it.producto, it.modo, it.cantidad, Math.round(it.precioUnit), Math.round(it.total), metodo]);
    }
  });
  if(regalados>0){
    const precioTaco = precioDe('Taco');
    rows.push([fecha, ticketId, 'Regalo', 'Taco', 'Regalo', regalados, precioTaco, Math.round(regalados*precioTaco), metodo]);
  }
  encolar('Ventas', rows);
  toast(`Venta registrada · ${metodo}`);
}

function datosCuentaHTML(){
  const filas = (cuenta||[]).filter(r=>r[0] && String(r[1]||'').trim());
  if(!filas.length) return `<div class="msg" style="padding:14px">Aún no hay datos de cuenta. Llena la pestaña <b>Cuenta</b> de tu hoja y toca ⚙ → Sincronizar precios y cuenta.</div>`;
  const texto = filas.map(([c,v])=>`${c}: ${v}`).join('\n');
  let qr = '';
  try{ qr = `<div class="qr">${qrSVG(texto)}<p>Escanea con la cámara de tu cel</p></div>`; }catch(e){ qr = ''; }
  const datos = filas.map(([c,v])=>`<div class="dato ${/clabe/i.test(c)?'big':''}"><small>${esc(c)}</small><b>${esc(v)}</b></div>`).join('');
  return `<div class="cta">${qr}<div>${datos}</div></div>`;
}

function qrSVG(texto){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  const n = q.getModuleCount(), m = 4;
  let d = '';
  for(let y=0; y<n; y++) for(let x=0; x<n; x++) if(q.isDark(y,x)) d += `M${x+m},${y+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" role="img" aria-label="Código QR con los datos de la cuenta" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

   Venta del día
   ========================================================= */
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function etiquetaFecha(iso){ const [y,m,d] = iso.split('-').map(Number); const f = new Date(y,m-1,d); return `${DIAS[f.getDay()]} ${d} ${MESES[m-1]}`; }

function moverDia(n){ irDia(sumarDias(diaActual || hoy(), n)); }

async function irDia(fecha){
  diaActual = fecha;
  const h = hoy();
  document.getElementById('diaLabel').textContent = etiquetaFecha(fecha);
  document.getElementById('chipHoy').classList.toggle('on', fecha===h);
  document.getElementById('chipAyer').classList.toggle('on', fecha===sumarDias(h,-1));
  document.getElementById('chipElegir').classList.toggle('on', fecha!==h && fecha!==sumarDias(h,-1));
  document.getElementById('diaPicker').value = fecha;
  const body = document.getElementById('diaBody');
  const anterior = sumarDias(fecha, -7);
  const locales = outbox.filter(i=>i.sheet==='Ventas').flatMap(i=>i.rows);

  if(!servicioListo()){
    const filas = locales.filter(r=>String(r[0]).slice(0,10)===fecha);
    if(!filas.length){ body.innerHTML = `<div class="msg">Configura el servicio en ⚙ Ajustes para ver tus ventas.</div>`; return; }
    renderDia(filas, [], filas.length);
    return;
  }
  const miPeticion = ++diaPeticion;
  body.innerHTML = `<div class="msg">Cargando ventas…</div>`;
  try{
    const data = await apiGet('ventas', {fechas: `${fecha},${anterior}`});
    if(miPeticion !== diaPeticion) return; // el usuario ya cambió de fecha
    const remotas = data.filas || [];
    const pendDia = locales.filter(r=>String(r[0]).slice(0,10)===fecha);
    const hoyFilas = remotas.filter(r=>String(r[0]).slice(0,10)===fecha).concat(pendDia);
    const antFilas = remotas.filter(r=>String(r[0]).slice(0,10)===anterior);
    renderDia(hoyFilas, antFilas, pendDia.length);
  }catch(e){
    if(miPeticion !== diaPeticion) return;
    body.innerHTML = `<div class="msg">No se pudieron cargar las ventas (${esc(e.message)}).<br><button class="addbtn" style="max-width:220px" onclick="irDia('${fecha}')">Reintentar</button></div>`;
  }
}

function kgCarne(r){
  // r: [Fecha, Ticket, Categoría, Producto, Modo, Cantidad, Precio, Total, Método]
  if(r[2]!=='Carne') return 0;
  const modo = r[4], cant = num(r[5]), precio = num(r[6]), total = num(r[7]);
  if(modo==='Fracción' || modo==='Surtido') return cant;
  if(modo==='Gramos') return cant/1000;
  if(modo==='Monto' || modo==='Dinero') return precio>0 ? total/precio : 0;
  return 0;
}

function resumir(filas){
  const ventas = filas.filter(r=>r[2]!=='Regalo');
  const regalos = filas.filter(r=>r[2]==='Regalo');
  const total = ventas.reduce((s,r)=>s+num(r[7]),0);
  const tickets = new Set(ventas.map(r=>r[1]).filter(Boolean)).size;
  const kg = ventas.reduce((s,r)=>s+kgCarne(r),0);
  const porHora = {}, porCat = {}, porPago = {};
  ventas.forEach(r=>{
    const h = parseInt(String(r[0]).slice(11,13),10);
    if(isFinite(h)) porHora[h] = (porHora[h]||0) + num(r[7]);
    const c = r[2] || 'Sin categoría'; porCat[c] = (porCat[c]||0) + num(r[7]);
    const p = r[8] || 'Sin método'; porPago[p] = (porPago[p]||0) + num(r[7]);
  });
  return {total, tickets, kg, porHora, porCat, porPago, tacosRegalo: regalos.reduce((s,r)=>s+num(r[5]),0)};
}

function renderDia(filasDia, filasAnt, nPend){
  const body = document.getElementById('diaBody');
  const r = resumir(filasDia);
  if(r.total<=0){
    body.innerHTML = `<div class="msg">Sin ventas registradas para ${esc(etiquetaFecha(diaActual))}.</div>`;
    return;
  }
  const a = resumir(filasAnt);
  let delta = '';
  if(a.total>0){
    const pct = (r.total/a.total - 1)*100;
    delta = `<p class="d ${pct>=0?'up':'down'}">${pct>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% vs ${DIAS[new Date(diaActual+'T12:00').getDay()].toLowerCase()} anterior</p>`;
  } else {
    delta = `<p class="d">Sin datos del ${DIAS[new Date(diaActual+'T12:00').getDay()].toLowerCase()} anterior</p>`;
  }
  const ticketProm = r.tickets ? r.total/r.tickets : 0;

  // Venta por hora
  const horas = Object.keys(r.porHora).map(Number);
  let svg = '<p class="hint">Sin hora registrada</p>';
  if(horas.length){
    const h0 = Math.min(...horas), h1 = Math.max(...horas);
    const lista = []; for(let h=h0; h<=h1; h++) lista.push(h);
    const max = Math.max(...lista.map(h=>r.porHora[h]||0), 1);
    const pico = lista.reduce((b,h)=>(r.porHora[h]||0)>(r.porHora[b]||0)?h:b, lista[0]);
    const W = 300, H = 110, gap = 4, bw = Math.max(6,(W - gap*(lista.length-1))/lista.length);
    svg = `<svg class="hsvg" viewBox="0 0 ${W} ${H+30}" width="100%" role="img" aria-label="Venta por hora">` +
      lista.map((h,i)=>{
        const v = r.porHora[h]||0, bh = Math.max(v>0?3:0, v/max*H), x = i*(bw+gap);
        return `<g><title>${pad(h)}:00 · ${fmt(v)}</title>
          <rect x="${x}" y="${H-bh+14}" width="${bw}" height="${bh}" rx="3" fill="${h===pico?'#F85E00':'#415A77'}"/>
          ${h===pico?`<text x="${x+bw/2}" y="${H-bh+9}" text-anchor="middle" font-size="10" fill="#fff">${fmt(v)}</text>`:''}
          <text x="${x+bw/2}" y="${H+27}" text-anchor="middle" font-size="10" fill="#9FB6C4">${h}</text></g>`;
      }).join('') + `</svg><p class="hint">Hora pico ${pad(pico)}:00</p>`;
  }

  const cats = Object.entries(r.porCat).sort((x,y)=>y[1]-x[1]);
  const top = cats.slice(0,4); const resto = cats.slice(4).reduce((s,c)=>s+c[1],0);
  if(resto>0) top.push(['Otros', resto]);
  const catsHtml = top.map(([c,v])=>`<div class="brow"><span class="n">${esc(c)}</span><span class="b"><i style="width:${(v/r.total*100).toFixed(1)}%"></i></span><span class="val">${fmt(v)}</span></div>`).join('');

  const colores = {Efectivo:'#F85E00', Tarjeta:'#9FB6C4', Transferencia:'#6F889A'};
  const pagos = Object.entries(r.porPago).sort((x,y)=>y[1]-x[1]);
  const payBar = pagos.map(([p,v])=>`<span style="width:${(v/r.total*100).toFixed(1)}%;background:${colores[p]||'#6F889A'}" title="${esc(p)}"></span>`).join('');
  const payList = pagos.map(([p,v])=>`<div class="brow"><span style="width:10px;height:10px;border-radius:3px;background:${colores[p]||'#6F889A'}"></span><span style="flex:1">${esc(p)}</span><span>${fmt(v)} · ${Math.round(v/r.total*100)}%</span></div>`).join('');

  body.innerHTML = `
    <div class="kpis">
      <div class="kpi main"><p class="l">Venta total</p><p class="v">${fmt(r.total)}</p>${delta}</div>
      <div class="kpi"><p class="l">Tickets</p><p class="v">${r.tickets}</p></div>
      <div class="kpi"><p class="l">Ticket promedio</p><p class="v">${fmt(ticketProm)}</p></div>
      <div class="kpi"><p class="l">Carne vendida</p><p class="v">${r.kg.toFixed(1)} kg</p></div>
    </div>
    <div class="dgrid">
      <div class="dcard"><h4>Venta por hora</h4>${svg}</div>
      <div class="dcard"><h4>Por categoría</h4>${catsHtml}</div>
      <div class="dcard"><h4>Cobro</h4><div class="paybar">${payBar}</div>${payList}
        <p class="hint" style="margin-top:8px">Efectivo esperado en caja: <b style="color:var(--text)">${fmt(r.porPago['Efectivo']||0)}</b></p>
        ${r.tacosRegalo>0?`<p class="hint">Tacos regalados: ${r.tacosRegalo}</p>`:''}
      </div>
    </div>
    ${nPend?`<p class="hint" style="margin-top:10px">Incluye ${nPend} renglones que aún no se envían a la hoja.</p>`:''}`;
}

/* =========================================================
   Arranque
   ========================================================= */
window.addEventListener('online', enviarPendientes);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') enviarPendientes(); });
setInterval(()=>{ if(outbox.length) enviarPendientes(); }, 60000);

window.addEventListener('load', ()=>{
  document.getElementById('verInicio').textContent = `v${APP_VERSION}`;
  renderChips(); renderGrid(); renderTicket(); updateBadge();
  if(servicioListo()){ cargarPrecios(); cargarCuenta(); enviarPendientes(); calcularDistribucionSurtido(); }
});
</script>
